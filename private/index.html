    bits.innerHTML=b.split('').map((x,i)=>`<div class="cell ${x==='1'?'ok':''}" data-i="${i}" style="cursor:pointer" title="nilai ${128>>i}">${x}</div>`).join('');
    $('#bn-bin').textContent=b;$('#bn-hex').textContent='0x'+v.toString(16).toUpperCase().padStart(2,'0');
    $$('.cell',bits).forEach(c=>c.onclick=()=>{
      const arr=$('#bn-bin').textContent.split('');const i=+c.dataset.i;arr[i]=arr[i]==='1'?'0':'1';
      $('#bn-dec').value=parseInt(arr.join(''),2);fromDec();});
  }
  function toTxt(){
    const s=$('#bn-txt').value;
    $('#bn-out').textContent=[...s].map(c=>`${c}  →  ${c.charCodeAt(0).toString().padStart(3,' ')}  →  ${c.charCodeAt(0).toString(2).padStart(8,'0')}`).join('\n')||'—';
  }
  $('#bn-dec').oninput=fromDec; $('#bn-txt').oninput=toTxt; fromDec(); toTxt();
 }
};

SIMS.pseudocode={
 judul:"Penelusuran (Tracing) Pseudocode",
 desc:"Jalankan program baris demi baris, amati perubahan nilai variabel, dan bandingkan dengan dugaanmu.",
 html:`<div class="sim-toolbar">
  <select id="ps-sel" style="width:auto">
   <option value="rerata">Menghitung rerata dan predikat</option>
   <option value="maks">Mencari nilai terbesar</option>
   <option value="faktorial">Faktorial dengan perulangan</option>
   <option value="ganjil">Menghitung bilangan genap</option>
  </select>
  <button class="btn sm primary" id="ps-step">Langkah berikutnya</button>
  <button class="btn sm" id="ps-run">▶ Jalankan</button>
  <button class="btn sm" id="ps-reset">Ulangi</button>
 </div>
 <div class="grid c2">
  <div><h3 style="margin-top:0">Pseudocode</h3><div class="code" id="ps-code"></div></div>
  <div><h3 style="margin-top:0">Nilai variabel</h3><div id="ps-vars"></div>
   <h3>Keluaran</h3><div class="log" id="ps-out" style="max-height:120px">—</div></div>
 </div>`,
 mount(){
  const P={
   rerata:{kode:["jumlah ← 0","data ← [80, 70, 90, 65, 85]","untuk setiap n pada data:","    jumlah ← jumlah + n","rerata ← jumlah / 5","jika rerata ≥ 75 maka","    tulis \"Tuntas\"","selain itu","    tulis \"Belum Tuntas\""],
    run(){const st=[],d=[80,70,90,65,85];let j=0;
     st.push({l:0,v:{jumlah:0},o:[]});st.push({l:1,v:{jumlah:0,data:'[80,70,90,65,85]'},o:[]});
     d.forEach((n)=>{st.push({l:2,v:{jumlah:j,n},o:[]});j+=n;st.push({l:3,v:{jumlah:j,n},o:[]})});
     const r=j/5;st.push({l:4,v:{jumlah:j,rerata:r},o:[]});
     st.push({l:5,v:{rerata:r},o:[]});
     if(r>=75)st.push({l:6,v:{rerata:r},o:['Tuntas']});else st.push({l:8,v:{rerata:r},o:['Belum Tuntas']});
     return st}},
   maks:{kode:["data ← [23, 67, 12, 89, 45]","maks ← data[1]","untuk i ← 2 sampai 5:","    jika data[i] > maks maka","        maks ← data[i]","tulis maks"],
    run(){const d=[23,67,12,89,45],st=[];let m=d[0];
     st.push({l:0,v:{data:'[23,67,12,89,45]'},o:[]});st.push({l:1,v:{maks:m},o:[]});
     for(let i=1;i<d.length;i++){st.push({l:2,v:{i:i+1,'data[i]':d[i],maks:m},o:[]});st.push({l:3,v:{i:i+1,'data[i]':d[i],maks:m},o:[]});
      if(d[i]>m){m=d[i];st.push({l:4,v:{i:i+1,maks:m},o:[]})}}
     st.push({l:5,v:{maks:m},o:['Nilai terbesar: '+m]});return st}},
   faktorial:{kode:["n ← 5","hasil ← 1","untuk i ← 1 sampai n:","    hasil ← hasil × i","tulis hasil"],
    run(){const st=[];let h=1;st.push({l:0,v:{n:5},o:[]});st.push({l:1,v:{n:5,hasil:1},o:[]});
     for(let i=1;i<=5;i++){st.push({l:2,v:{i,hasil:h},o:[]});h*=i;st.push({l:3,v:{i,hasil:h},o:[]})}
     st.push({l:4,v:{hasil:h},o:['5! = '+h]});return st}},
   ganjil:{kode:["data ← [4, 7, 10, 3, 8, 15]","genap ← 0","untuk setiap n pada data:","    jika n mod 2 = 0 maka","        genap ← genap + 1","tulis genap"],
    run(){const d=[4,7,10,3,8,15],st=[];let g=0;
     st.push({l:0,v:{data:'[4,7,10,3,8,15]'},o:[]});st.push({l:1,v:{genap:0},o:[]});
     d.forEach(n=>{st.push({l:2,v:{n,genap:g},o:[]});st.push({l:3,v:{n,'n mod 2':n%2,genap:g},o:[]});
      if(n%2===0){g++;st.push({l:4,v:{n,genap:g},o:[]})}});
     st.push({l:5,v:{genap:g},o:['Banyak bilangan genap: '+g]});return st}}
  };
  let cur='rerata',steps=[],i=0,timer=null,out=[];
  function paint(){
    const p=P[cur],s=steps[i]||{l:-1,v:{},o:[]};
    $('#ps-code').innerHTML=p.kode.map((l,n)=>`<span class="ln ${n===s.l?'cur':''}">${String(n+1).padStart(2,' ')} │ ${esc(l)}</span>`).join('');
    const vs=Object.entries(s.v||{});
    $('#ps-vars').innerHTML=vs.length?`<div class="tbl-wrap"><table class="trace-tbl"><thead><tr><th>Variabel</th><th>Nilai</th></tr></thead><tbody>${vs.map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Belum ada variabel.</p>';
    $('#ps-out').textContent=out.length?out.join('\n'):'—';
  }
  function reset(){clearInterval(timer);timer=null;$('#ps-run').textContent='▶ Jalankan';cur=$('#ps-sel').value;steps=P[cur].run();i=-1;out=[];paint()}
  function step(){if(i<steps.length-1){i++;(steps[i].o||[]).forEach(o=>out.push(o));paint()}else{clearInterval(timer);timer=null;$('#ps-run').textContent='▶ Jalankan'}}
  $('#ps-sel').onchange=reset;$('#ps-reset').onclick=reset;$('#ps-step').onclick=step;
  $('#ps-run').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#ps-run').textContent='▶ Jalankan';return}$('#ps-run').textContent='⏸ Jeda';timer=setInterval(step,700)};
  reset();
 }
};

SIMS.dataviz={
 judul:"Analisis Data Mini",
 desc:"Masukkan data hasil survei kelas, hitung statistiknya, lalu baca grafiknya. Cocok dipakai saat mengerjakan LKPD Analisis Data.",
 html:`<div class="grid c2">
  <div>
   <label class="fld">Label (pisahkan dengan koma)</label>
   <input id="dv-lab" type="text" value="Senin, Selasa, Rabu, Kamis, Jumat, Sabtu">
   <label class="fld">Data angka (pisahkan dengan koma)</label>
   <textarea id="dv-num" rows="3">34, 28, 41, 25, 47, 19</textarea>
   <div class="row" style="margin-top:.6rem">
     <button class="btn sm primary" id="dv-go">Hitung dan gambar</button>
     <select id="dv-type" style="width:auto"><option value="bar">Diagram batang</option><option value="line">Diagram garis</option></select>
     <button class="btn sm" id="dv-ex">Contoh data lain</button>
   </div>
  </div>
  <div><canvas id="dv-cv" width="560" height="300"></canvas></div>
 </div>
 <div class="stat-row" id="dv-stats"></div>
 <div class="note ok" id="dv-sim" style="margin-top:.8rem"></div>`,
 mount(){
  const CV=$('#dv-cv'),ctx=CV.getContext('2d');
  const EX=[["Senin, Selasa, Rabu, Kamis, Jumat, Sabtu","34, 28, 41, 25, 47, 19"],
            ["X-1, X-2, X-3, X-4, X-5","78, 83, 69, 91, 74"],
            ["<1 jam, 1-2 jam, 3-4 jam, >4 jam","6, 14, 9, 7"]];
  let ex=0;
  function stats(a){
    const n=a.length,sum=a.reduce((x,y)=>x+y,0),mean=sum/n;
    const s=[...a].sort((x,y)=>x-y);
    const med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
    const f={};a.forEach(v=>f[v]=(f[v]||0)+1);
    const mx=Math.max(...Object.values(f));
    const mod=Object.keys(f).filter(k=>f[k]===mx).join(', ');
    const sd=Math.sqrt(a.reduce((t,v)=>t+(v-mean)**2,0)/n);
    return {n,sum,mean,med,mod,min:Math.min(...a),max:Math.max(...a),sd};
  }
  function draw(labels,vals,type){
    const W=CV.width,H=CV.height,P=42;
    const cs=getComputedStyle(document.documentElement);
    const ink=cs.getPropertyValue('--ink-2')||'#444', line=cs.getPropertyValue('--line')||'#ddd';
    ctx.clearRect(0,0,W,H);
    const max=Math.max(...vals,1)*1.15;
    ctx.strokeStyle=line;ctx.lineWidth=1;ctx.fillStyle=ink;ctx.font='11px system-ui';
    for(let g=0;g<=4;g++){const y=H-P-(H-P*1.4)*g/4;
      ctx.beginPath();ctx.moveTo(P,y);ctx.lineTo(W-10,y);ctx.stroke();
      ctx.fillText(Math.round(max*g/4),6,y+4);}
    const bw=(W-P-14)/vals.length;
    if(type==='bar'){
      vals.forEach((v,i)=>{
        const h=(H-P*1.4)*(v/max),x=P+i*bw+bw*0.17,y=H-P-h;
        const grd=ctx.createLinearGradient(0,y,0,H-P);grd.addColorStop(0,'#5b4fd6');grd.addColorStop(1,'#2f2a7a');
        ctx.fillStyle=grd;ctx.fillRect(x,y,bw*0.66,h);
        ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText(v,x+bw*0.33,y-5);
        ctx.fillText((labels[i]||'').slice(0,9),x+bw*0.33,H-P+16);ctx.textAlign='left';});
    }else{
      ctx.strokeStyle='#0f7f66';ctx.lineWidth=2.5;ctx.beginPath();
      vals.forEach((v,i)=>{const x=P+i*bw+bw/2,y=H-P-(H-P*1.4)*(v/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
      ctx.stroke();ctx.fillStyle='#0f7f66';
      vals.forEach((v,i)=>{const x=P+i*bw+bw/2,y=H-P-(H-P*1.4)*(v/max);
        ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
        ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText(v,x,y-9);ctx.fillText((labels[i]||'').slice(0,9),x,H-P+16);ctx.fillStyle='#0f7f66';ctx.textAlign='left';});
    }
  }
  function run(){
    const labels=$('#dv-lab').value.split(',').map(s=>s.trim());
    const vals=$('#dv-num').value.split(/[,\s]+/).map(Number).filter(v=>!isNaN(v));
    if(vals.length<2)return toast('Masukkan minimal dua angka');
    const s=stats(vals);
    $('#dv-stats').innerHTML=[['Jumlah data',s.n],['Total',s.sum],['Rerata',s.mean.toFixed(2)],['Median',s.med],['Modus',s.mod],['Minimum',s.min],['Maksimum',s.max],['Simpangan baku',s.sd.toFixed(2)]]
      .map(([a,b])=>`<div class="stat"><i>${a}</i><b>${b}</b></div>`).join('');
    const iMax=vals.indexOf(s.max),iMin=vals.indexOf(s.min);
    $('#dv-sim').innerHTML=`<b>Pembacaan otomatis:</b> nilai tertinggi ada pada <b>${esc(labels[iMax]||'data ke-'+(iMax+1))}</b> (${s.max}) dan terendah pada <b>${esc(labels[iMin]||'data ke-'+(iMin+1))}</b> (${s.min}). Rerata ${s.mean.toFixed(2)} ${Math.abs(s.mean-s.med)>s.sd/2?'berbeda cukup jauh dari median, menandakan ada nilai pencilan yang menarik rerata.':'dekat dengan median, sehingga data cukup merata.'} Tuliskan rekomendasimu berdasarkan temuan ini.`;
    draw(labels,vals,$('#dv-type').value);
  }
  $('#dv-go').onclick=run;$('#dv-type').onchange=run;
  $('#dv-ex').onclick=()=>{ex=(ex+1)%EX.length;$('#dv-lab').value=EX[ex][0];$('#dv-num').value=EX[ex][1];run()};
  run();
 }
};

SIMS.jaringan={
 judul:"Simulasi Jaringan dan Troubleshooting",

 mount(){

  async function kirim(){

    for(let s=0;s<jalur.length;s++){

      for(let t=0;t<=1.001;t+=0.05){

    gw:{none:'Reply from 192.168.1.1: time=1ms — gateway terjangkau.',kabel:'Destination host unreachable.',ip:'Destination host unreachable — beda jaringan.',router:'Request timed out.',dns:'Reply from 192.168.1.1: time=1ms.'},
    net:{none:'Reply from 8.8.8.8: time=28ms — internet terjangkau.',kabel:'Destination host unreachable.',ip:'Destination host unreachable.',router:'Request timed out.',dns:'Reply from 8.8.8.8: time=30ms — koneksi internet normal.'},

  $$('[data-dg]').forEach(b=>b.onclick=()=>{

SIMS.graf={
 judul:"Penelusuran Graf: BFS dan DFS",
 desc:"Amati perbedaan penelusuran melebar (BFS) yang memakai antrean dan penelusuran mendalam (DFS) yang memakai tumpukan.",
 html:`<div class="sim-toolbar">
   <select id="gf-alg" style="width:auto"><option value="bfs">BFS — penelusuran melebar</option><option value="dfs">DFS — penelusuran mendalam</option></select>
   <select id="gf-start" style="width:auto"></select>
   <button class="btn sm primary" id="gf-run">▶ Telusuri</button>
   <button class="btn sm" id="gf-reset">Ulangi</button>
 </div>
 <svg id="gf-svg" viewBox="0 0 560 300" style="width:100%;background:var(--bg-3);border-radius:12px;border:1px solid var(--line)"></svg>
 <div class="stat-row">
   <div class="stat" style="min-width:200px"><i id="gf-ds-lab">Antrean</i><b id="gf-ds">—</b></div>
   <div class="stat" style="min-width:220px"><i>Urutan kunjungan</i><b id="gf-order">—</b></div>
 </div>
 <div class="note" style="margin-top:.8rem" id="gf-ket">BFS mengunjungi simpul lapis demi lapis; DFS menelusuri satu cabang sedalam mungkin lebih dahulu.</div>`,
 mount(){
  const P={A:[70,60],B:[210,40],C:[210,150],D:[350,40],E:[350,160],F:[480,100],G:[300,255],H:[140,250]};
  const E=[['A','B'],['A','C'],['B','D'],['C','D'],['C','E'],['D','F'],['E','F'],['C','H'],['E','G'],['G','H']];
  const ADJ={};Object.keys(P).forEach(k=>ADJ[k]=[]);
  E.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
  Object.keys(ADJ).forEach(k=>ADJ[k].sort());
  $('#gf-start').innerHTML=Object.keys(P).map(k=>`<option value="${k}">Mulai dari ${k}</option>`).join('');
  function draw(visited=[],cur=null,frontier=[]){
    const svg=$('#gf-svg'); if(!svg) return;
    let h=E.map(([a,b])=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="#8a90b5" stroke-width="2"/>`).join('');
    h+=Object.entries(P).map(([k,[x,y]])=>{
      const fill=k===cur?'#0f7f66':visited.includes(k)?'#4740ad':frontier.includes(k)?'#f0a93c':'#ffffff';
      const tc=(fill==='#ffffff')?'#2f2a7a':'#ffffff';
      return `<g><circle cx="${x}" cy="${y}" r="20" fill="${fill}" stroke="#2f2a7a" stroke-width="2"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" style="font:700 14px system-ui" fill="${tc}">${k}</text></g>`}).join('');
    svg.innerHTML=h;
  }
  let busy=false;
  async function run(){
    if(busy)return;busy=true;
    const alg=$('#gf-alg').value,start=$('#gf-start').value;
    $('#gf-ds-lab').textContent=alg==='bfs'?'Antrean (queue)':'Tumpukan (stack)';
    const seen=new Set([start]);let ds=[start],order=[];
    while(ds.length){
      const cur=alg==='bfs'?ds.shift():ds.pop();
      order.push(cur);
      draw(order,cur,ds);
      if(!$('#gf-ds'))return; $('#gf-ds').textContent=ds.join(' ')||'—';
      $('#gf-order').textContent=order.join(' → ');
      await sleep(650);
      const tet=alg==='bfs'?ADJ[cur]:[...ADJ[cur]].reverse();
      for(const n of tet) if(!seen.has(n)){seen.add(n);ds.push(n)}
      draw(order,null,ds);
      $('#gf-ds').textContent=ds.join(' ')||'—';
      await sleep(250);
    }
    confetti(40);
    $('#gf-ket').innerHTML=`Selesai. Urutan kunjungan <b>${alg.toUpperCase()}</b> dari simpul ${start}: <b>${order.join(' → ')}</b>. ${alg==='bfs'?'BFS cocok mencari jarak terpendek dalam jumlah sisi.':'DFS cocok menelusuri seluruh cabang, misalnya mencari jalan keluar labirin.'}`;
    busy=false;
  }
  $('#gf-run').onclick=run;
  $('#gf-reset').onclick=()=>{if(!busy){draw();$('#gf-ds').textContent='—';$('#gf-order').textContent='—'}};
  draw();
 }
};

SIMS.strategi={
 judul:"Brute Force vs Greedy: Persoalan Penukaran Uang",
 desc:"Bandingkan hasil dan jumlah langkah dua strategi. Temukan kasus ketika strategi greedy ternyata tidak optimal.",
 html:`<div class="sim-toolbar">
   <label style="font-size:.78rem">Sistem pecahan</label>
   <select id="st-sys" style="width:auto">
     <option value="rupiah">Rupiah: 20000, 10000, 5000, 2000, 1000</option>
     <option value="aneh">Pecahan khusus: 4, 3, 1</option>
   </select>
   <label style="font-size:.78rem">Jumlah yang ditukar</label><input id="st-n" type="number" value="37000" style="width:110px">
   <button class="btn sm primary" id="st-go">Bandingkan</button>
 </div>
 <div class="grid c2" id="st-out"></div>
 <div class="note" id="st-ket" style="margin-top:.9rem"></div>`,
 mount(){
  function greedy(coins,target){
    let sisa=target,pakai=[],langkah=0;
    for(const c of coins){while(sisa>=c){sisa-=c;pakai.push(c);langkah++} langkah++}
    return {pakai,sisa,langkah,jumlah:pakai.length};
  }
  function optimal(coins,target){
    const INF=1e9,dp=Array(target+1).fill(INF),pick=Array(target+1).fill(-1);dp[0]=0;let langkah=0;
    for(let v=1;v<=target;v++) for(const c of coins){langkah++;if(c<=v&&dp[v-c]+1<dp[v]){dp[v]=dp[v-c]+1;pick[v]=c}}
    if(dp[target]>=INF) return {gagal:true,langkah};
    const pakai=[];let v=target;while(v>0){pakai.push(pick[v]);v-=pick[v]}
    return {pakai,jumlah:dp[target],langkah};
  }
  function run(){
    const sys=$('#st-sys').value;
    const coins=sys==='rupiah'?[20000,10000,5000,2000,1000]:[4,3,1];
    let t=Math.max(1,Math.min(sys==='rupiah'?200000:60,+$('#st-n').value||0));
    if(sys==='rupiah') t=Math.round(t/1000)*1000;
    $('#st-n').value=t;
    const g=greedy(coins,t),o=optimal(coins,t);
    const kartu=(j,r,warna)=>`<div class="card"><h3 style="margin-top:0;color:${warna}">${j}</h3>
      <p><b>Pecahan dipakai:</b> ${r.pakai&&r.pakai.length?r.pakai.join(' + '):'—'}</p>
      <p><b>Banyak keping:</b> ${r.jumlah ?? '—'} ${r.sisa?`<br><b>Sisa tidak tertukar:</b> ${r.sisa}`:''}</p>
      <p class="muted">Perkiraan langkah perhitungan: ${r.langkah}</p></div>`;
    $('#st-out').innerHTML=kartu('Strategi Greedy',g,'var(--warn)')+kartu('Strategi Optimal (menyeluruh)',o,'var(--accent)');
    const sama=g.jumlah===o.jumlah&&!g.sisa;
    $('#st-ket').className='note '+(sama?'ok':'warn');
    $('#st-ket').innerHTML=sama
      ? `<b>Greedy sudah optimal pada kasus ini.</b> Pada sistem pecahan rupiah, mengambil pecahan terbesar lebih dulu selalu menghasilkan jumlah keping paling sedikit. Greedy jauh lebih cepat (${g.langkah} langkah) dibanding penyelesaian menyeluruh (${o.langkah} langkah).`
      : `<b>Greedy tidak optimal di sini.</b> Greedy memakai ${g.jumlah} keping${g.sisa?' dan menyisakan '+g.sisa:''}, sedangkan solusi optimal hanya ${o.jumlah} keping. Inilah sebabnya strategi greedy harus dibuktikan dahulu kebenarannya untuk sistem pecahan tertentu. Coba sistem pecahan khusus dengan jumlah 6.`;
  }
  $('#st-go').onclick=run;$('#st-sys').onchange=()=>{$('#st-n').value=$('#st-sys').value==='rupiah'?37000:6;run()};
  run();
 }
};

SIMS.sandi={
 judul:"Pemeriksa Kekuatan Kata Sandi dan Simulasi 2FA",
 desc:"Uji kekuatan kata sandi (tidak dikirim ke mana pun, seluruh perhitungan terjadi di perangkatmu) dan coba cara kerja autentikasi dua langkah.",
 html:`<div class="grid c2">
  <div><h3 style="margin-top:0">Uji kata sandi</h3>
   <label class="fld">Ketik kata sandi percobaan (jangan gunakan sandi aslimu)</label>
   <input id="pw-in" type="text" value="pinrang123">

   <div class="stat-row" style="margin-top:0">
     <div class="stat"><i>Tingkat</i><b id="pw-lv">—</b></div>
     <div class="stat"><i>Perkiraan entropi</i><b id="pw-en">—</b></div>
     <div class="stat" style="min-width:160px"><i>Perkiraan waktu dibobol</i><b id="pw-tm">—</b></div>
   </div>
   <ul id="pw-tips" style="margin-top:.8rem"></ul>
  </div>
  <div><h3 style="margin-top:0">Simulasi autentikasi dua langkah</h3>
   <p class="muted">Aplikasi autentikator menghasilkan kode yang berubah setiap 30 detik. Kode ini tidak pernah dikirim lewat jaringan.</p>
   <div class="card" style="text-align:center;background:var(--bg-3)">
     <div class="muted" style="font-size:.74rem;letter-spacing:.1em;text-transform:uppercase">Kode autentikator</div>
     <div id="tf-code" style="font-family:var(--mono);font-size:2.1rem;font-weight:800;letter-spacing:.18em">000000</div>
     <div class="deck-prog" style="background:var(--line)"><i id="tf-bar" style="width:100%"></i></div>
     <div class="muted" id="tf-sec" style="margin-top:.4rem">30 detik</div>
   </div>
   <label class="fld">Masukkan kode untuk masuk</label>
   <div class="row"><input id="tf-in" type="text" maxlength="6" placeholder="6 digit" style="width:140px"><button class="btn sm primary" id="tf-go">Verifikasi</button></div>
   <div class="note" id="tf-fb" style="margin-top:.7rem">Coba juga memasukkan kode lama setelah kode berganti — hasilnya akan ditolak.</div>
  </div></div>`,
 mount(){
  const COMMON=['123456','password','qwerty','admin','sekolah','informatika','pinrang','12345678','111111','abc123'];
  function cek(){
    const p=$('#pw-in').value;
    let pool=0;
    if(/[a-z]/.test(p))pool+=26; if(/[A-Z]/.test(p))pool+=26; if(/[0-9]/.test(p))pool+=10;
    if(/[^a-zA-Z0-9]/.test(p))pool+=32;
    let ent=p.length?Math.round(p.length*Math.log2(pool||1)):0;
    const lemahUmum=COMMON.some(c=>p.toLowerCase().includes(c));
    if(lemahUmum) ent=Math.max(8,Math.round(ent*0.45));
    if(/^(.)\1+$/.test(p)) ent=Math.min(ent,10);
    const tebakanPerDetik=1e10;
    const detik=Math.pow(2,ent)/tebakanPerDetik;
    const fmt=d=>d<1?'kurang dari 1 detik':d<60?Math.round(d)+' detik':d<3600?Math.round(d/60)+' menit':d<86400?Math.round(d/3600)+' jam':d<3.15e7?Math.round(d/86400)+' hari':d<3.15e9?Math.round(d/3.15e7)+' tahun':'ribuan tahun';
    const lv=ent<28?['Sangat lemah','var(--danger)',15]:ent<40?['Lemah','var(--warn)',35]:ent<60?['Cukup','var(--warn)',60]:ent<80?['Kuat','var(--accent)',82]:['Sangat kuat','var(--accent)',100];
    $('#pw-lv').textContent=lv[0];$('#pw-lv').style.color=lv[1];
    $('#pw-en').textContent=ent+' bit';$('#pw-tm').textContent=fmt(detik);
    $('#pw-bar').style.width=lv[2]+'%';
    const tips=[];
    if(p.length<12)tips.push('Panjangkan menjadi minimal 12 karakter — panjang lebih penting daripada rumit.');
    if(!/[A-Z]/.test(p)||!/[a-z]/.test(p))tips.push('Campurkan huruf besar dan kecil.');
    if(!/[0-9]/.test(p))tips.push('Tambahkan angka di posisi yang tidak mudah ditebak.');
    if(!/[^a-zA-Z0-9]/.test(p))tips.push('Tambahkan simbol seperti ! ? # atau -.');
    if(lemahUmum)tips.push('Hindari kata umum, nama daerah, atau nama sekolah.');
    tips.push('Gunakan kata sandi berbeda untuk setiap akun dan simpan di manajer kata sandi.');
    tips.push('Aktifkan autentikasi dua langkah pada akun penting.');
    $('#pw-tips').innerHTML=tips.map(t=>`<li>${esc(t)}</li>`).join('');
  }
  let kode='------',sisa=0,tm=null;
  function newCode(){kode=String(rnd(0,999999)).padStart(6,'0');sisa=30;$('#tf-code').textContent=kode}
  function tick(){
    const bar=$('#tf-bar'); if(!bar){clearInterval(window.__tf);return}
    sisa--; if(sisa<=0) newCode();
    bar.style.width=(sisa/30*100)+'%';$('#tf-sec').textContent=sisa+' detik';
  }
  $('#pw-in').oninput=cek; cek(); newCode(); tick();
  clearInterval(window.__tf); window.__tf=setInterval(tick,1000);
  $('#tf-go').onclick=()=>{
    const v=$('#tf-in').value.trim();
    const ok=v===kode;
    $('#tf-fb').className='note '+(ok?'ok':'warn');
    $('#tf-fb').innerHTML=ok?'<b>Berhasil masuk.</b> Kode cocok dan masih berlaku. Setelah ini kode akan berganti lagi.'
      :'<b>Kode ditolak.</b> Kode salah atau sudah kedaluwarsa. Inilah yang membuat 2FA aman: kode hanya berlaku 30 detik dan tidak dapat dipakai ulang.';
  };
 }
};

B11 =MIN(B2:B7)              → ${Math.min(...nilai)}

    $('#pk-sim').innerHTML=`<b>Pembacaan otomatis:</b> ${tuntas} dari ${n} murid mencapai kriteria 75. Rerata kelas ${avg.toFixed(1)}. ${avg>=75?'Kelas sudah berada di atas kriteria ketuntasan.':'Rerata masih di bawah kriteria — perlu pembelajaran ulang pada tujuan yang belum tercapai.'}`;

    const W=480,H=220,P=32;ctx.clearRect(0,0,W,H);

 mount(){

  ];

    $$('#pg-pool [data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;pool=pool.filter(x=>x!==i);slot.push(i);paint()});
    $$('#pg-slot [data-s]').forEach(b=>b.onclick=()=>{const n=+b.dataset.s;pool.push(slot[n]);slot.splice(n,1);paint()});

  }

    const W=470,H=220,P=34;ctx.clearRect(0,0,W,H);
    const max=100;const bw=(W-P-10)/TAHAP.length;

    if(benar)confetti(50);
  };
  $('#pg-ulang').onclick=acak;
  acak();chart();
 }
};

function mountDeck(m,deck){
  let i=0;
  const stage=$('#dk-stage'),wrap=$('#dk-wrap');
  function mountSimInto(area,id){
    if(!area)return;
    let node=simCache[id];
    if(node){area.innerHTML='';area.appendChild(node);return}
    node=document.createElement('div');
    area.innerHTML='';area.appendChild(node);
    node.innerHTML=(SIMS[id]&&SIMS[id].html)||'<p class="muted">Simulasi belum tersedia.</p>';
    try{SIMS[id]&&SIMS[id].mount()}catch(e){console.warn(e);area.innerHTML='<p class="muted">Simulasi gagal dimuat.</p>'}
    simCache[id]=node;
  }
  function show(n){
    i=Math.max(0,Math.min(deck.length-1,n));
    const sl=deck[i];
    if(sl.type==='canva'){
      stage.innerHTML=`<div class="sl" style="padding:0;background:#111">
        <iframe src="${esc(sl.url)}" style="width:100%;height:100%;border:0" allow="fullscreen" loading="lazy"></iframe></div>`;
    }else{
      stage.innerHTML=slideHTML(sl,m,i,deck.length);
      if(sl.type==='sim') mountSimInto($('.simarea',stage),sl.sim);
      else if(sl.type==='kuis'){const b=$('.kuisbox',stage); if(b) mountKuis(b,sl.kuis)}
      else hydrateFigures(stage);
    }
    $('#dk-num').textContent=`${i+1} / ${deck.length}`;
    $('#dk-prog').style.width=((i+1)/deck.length*100)+'%';
    $('#dk-prev').disabled=i===0;$('#dk-next').disabled=i===deck.length-1;
    $$('#dk-rail .thumb').forEach(t=>t.classList.toggle('on',+t.dataset.i===i));
    const on=$('#dk-rail .thumb.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  }
  const move=d=>show(i+d);
  $('#dk-prev').onclick=()=>move(-1);$('#dk-next').onclick=()=>move(1);
  $('#fs-prev').onclick=()=>move(-1);$('#fs-next').onclick=()=>move(1);
  $$('#dk-rail .thumb').forEach(t=>t.onclick=()=>show(+t.dataset.i));
  function toggleFull(on){
    wrap.classList.toggle('isfull',on);
    if(on&&wrap.requestFullscreen)wrap.requestFullscreen().catch(()=>{});
    else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  }
  $('#dk-full').onclick=()=>toggleFull(true);
  $('#fs-exit').onclick=()=>toggleFull(false);
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)wrap.classList.remove('isfull')});
  $('#dk-print').onclick=()=>{toast('Pilih "Simpan sebagai PDF" pada jendela cetak');setTimeout(()=>window.print(),500)};
  window.__deckKeys=e=>{
    if(['INPUT','TEXTAREA','SELECT'].includes((e.target.tagName||'')))return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}
    else if(e.key.toLowerCase()==='f'){toggleFull(!wrap.classList.contains('isfull'))}
    else if(e.key==='Escape'){toggleFull(false)}
  };
  show(0);
}

  <div class="card"><h3 style="margin-top:0">🎨 Tempelkan slide Canva ke dalam pertemuan</h3>
   <p>Bila Ibu sudah membuat desain di Canva, salin tautan sematnya lalu tempelkan di baris pertemuan yang sesuai. Slide Canva akan muncul sebagai salindia tambahan di awal dek pertemuan tersebut.</p>
   <ol><li>Buka desain di Canva → tombol <b>Bagikan</b> → <b>Lainnya</b> → <b>Sematkan</b>.</li>
   <li>Salin tautan yang diawali <code>https://www.canva.com/design/…/view?embed</code>.</li>
   <li>Tempelkan pada kolom di bawah; tersimpan otomatis di perangkat ini.</li></ol>
   <div class="tbl-wrap"><table><thead><tr><th style="width:16%">Pertemuan</th><th style="width:34%">Judul</th><th>Tautan semat Canva</th></tr></thead><tbody>${baris}</tbody></table></div>
   <div class="row" style="margin-top:.7rem"><button class="btn" id="cv-clear">Hapus semua tautan</button><span class="muted" id="cv-info"></span></div>
   <div class="note warn" style="margin-top:.8rem">Slide Canva memerlukan internet saat ditayangkan. Slide bawaan aplikasi tetap berjalan tanpa internet.</div>
  </div>
  <div class="card"><h3 style="margin-top:0">⬇ Unduh dek slide</h3>
   <p>Seluruh slide tersedia sebagai berkas PowerPoint. Unggah ketiga berkas ini ke repositori bersama <code>index.html</code> agar tombol unduh berfungsi, lalu <b>impor berkas tersebut ke Canva</b> (Canva → Buat desain → Unggah → pilih berkas .pptx) bila ingin mempercantik desainnya.</p>
   <div class="row">${KELAS.map(k=>`<a class="btn" href="${encodeURI('Slide Informatika Kelas '+k+' - SMAN 11 Pinrang.pptx')}" download>Kelas ${k} (.pptx)</a>`).join('')}</div>
   <p class="muted" style="margin-bottom:0">Dek per pertemuan juga dapat disimpan sebagai PDF melalui tombol <b>Unduh slide (PDF)</b> di halaman pertemuan.</p>
  </div>
  <div class="card"><h3 style="margin-top:0">💾 Gambar tersimpan di perangkat</h3>
   <p id="st-sum">Memeriksa…</p><p class="muted" id="st-est"></p>
   <div class="row"><button class="btn primary" id="st-dl">Unduh gambar yang belum tersimpan</button>
   <button class="btn" id="st-pin">Jadikan penyimpanan permanen</button>
   <button class="btn" id="st-cl">Kosongkan penyimpanan</button></div>
   <p class="muted" style="margin-bottom:0">Gambar diambil sekali dari Wikimedia Commons (lisensi bebas) lalu disimpan di IndexedDB. Bila gagal, aplikasi memakai ilustrasi SVG bawaan.</p>
  </div>
  <div class="card"><h3 style="margin-top:0">ℹ️ Tentang</h3>
   <div class="tbl-wrap"><table><tbody>
    <tr><td style="width:30%">Penyusun</td><td>${esc(GURU)} — NIP ${esc(NIP)}</td></tr>
    <tr><td>Satuan pendidikan</td><td>${esc(SEKOLAH)}</td></tr>
    <tr><td>Acuan</td><td>Capaian Pembelajaran BSKAP 046/H/KR/2025 · Pembelajaran Mendalam</td></tr>
    <tr><td>Isi</td><td>${MODULES.length} pertemuan, ${MODULES.reduce((a,m)=>a+m.slides.length+2,0)} salindia, ${SIM_LIST.length} simulasi</td></tr>
   </tbody></table></div></div>`;
}

/* ---------------- init ---------------- */
route('/',pageBeranda);
route('/kelas/:kelas',pageKelas);
route('/modul/:id',pageModul);
route('/simulasi',pageSimIndex);
route('/simulasi/:id',pageSim);
route('/pengaturan',pagePengaturan);
buildNav();
window.addEventListener('hashchange',go);
$('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=n;store.set('tema',n)};
$('#burger').onclick=()=>{$('#sidebar').classList.toggle('on');$('#scrim').classList.toggle('on')};
$('#scrim').onclick=()=>{$('#sidebar').classList.remove('on');$('#scrim').classList.remove('on')};
$('#cacheBar').onclick=()=>location.hash='#/pengaturan';
document.addEventListener('keydown',e=>{if(window.__deckKeys&&location.hash.indexOf('#/modul/')===0)window.__deckKeys(e)});
(async function(){
  go();
  const keys=await IDB.keys();
  setCacheBar(keys.length?`Media ${keys.length}/${Object.keys(IMAGES).length}`:'Menyiapkan media…',keys.length?'ok':'load');
  if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
  if(keys.length<Object.keys(IMAGES).length&&navigator.onLine!==false) setTimeout(()=>prefetchAll(false),900);
})();
</script>
