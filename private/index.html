<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide &amp; Simulasi Informatika — SMA Negeri 11 Pinrang</title>
<meta name="description" content="Media pembelajaran Informatika Fase E dan F: slide presentasi bergaya desain modern dengan simulasi interaktif di setiap pertemuan.">
<meta name="theme-color" content="#1b1446">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231b1446'/%3E%3Cpath d='M16 42V22l9 11 9-11v20' stroke='%2300e0b0' stroke-width='5' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='39' r='4.5' fill='%23ff8a5b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fc; --bg-2:#ffffff; --bg-3:#edeffa; --line:#e0e3f2; --line-2:#c7cce6;
  --ink:#141833; --ink-2:#4a5071; --ink-3:#7b8199;
  --brand:#3a2fb0; --brand-2:#5b4ae0; --brand-soft:#eceafd;
  --accent:#00a186; --accent-soft:#dcf7f0; --warn:#b4650a; --warn-soft:#fdf0db;
  --danger:#b3302f; --danger-soft:#fce5e5;
  --shadow:0 1px 2px rgba(16,20,40,.05),0 10px 30px rgba(16,20,40,.08);
  --shadow-lg:0 30px 80px rgba(16,20,40,.26);
  --r:16px; --maxw:1180px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0b0d1c; --bg-2:#141829; --bg-3:#1d2236; --line:#2a3050; --line-2:#3b4167;
  --ink:#f0f2fc; --ink-2:#b8bed6; --ink-3:#868db0;
  --brand:#b3aaff; --brand-2:#9a8dff; --brand-soft:#232746;
  --accent:#4fe0c0; --accent-soft:#14352e; --warn:#f3c278; --warn-soft:#3b2d13;
  --danger:#ff9e9e; --danger-soft:#3b1e1e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
a{color:var(--brand-2)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem;letter-spacing:-.02em}
h1{font-size:clamp(1.6rem,1.1rem + 1.8vw,2.3rem)}
h2{font-size:clamp(1.2rem,1rem + .9vw,1.55rem);margin-top:1.6rem}
h3{font-size:1.02rem;margin-top:1.1rem}
p{margin:.45rem 0 .85rem}
code,kbd{font-family:var(--mono);font-size:.9em;background:var(--bg-3);padding:.1em .38em;border-radius:6px}
button{font-family:inherit;font-size:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;display:flex;flex-direction:column}
.brand{display:flex;gap:.65rem;align-items:center;padding:1rem .95rem .85rem;border-bottom:1px solid var(--line)}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3a2fb0,#00a186);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.brand b{display:block;font-size:.93rem;line-height:1.15}
.brand span{font-size:.72rem;color:var(--ink-3)}
.nav{padding:.5rem .55rem 1rem;flex:1}
.nav-title{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:.8rem .55rem .3rem;font-weight:800}
.nav a{display:flex;align-items:center;gap:.55rem;padding:.45rem .6rem;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:.885rem;font-weight:550}
.nav a:hover{background:var(--bg-3);color:var(--ink)}
.nav a.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav a .ic{width:20px;text-align:center;flex:none}
.nav details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.55rem;padding:.45rem .6rem;border-radius:10px;font-size:.885rem;font-weight:700;color:var(--ink-2)}
.nav details>summary::-webkit-details-marker{display:none}
.nav details>summary:hover{background:var(--bg-3)}
.nav details .sub{padding-left:.5rem;border-left:2px solid var(--line);margin:.1rem 0 .4rem .95rem}
.nav details .sub a{font-size:.825rem;padding:.34rem .5rem;font-weight:500}
.sidebar-foot{padding:.7rem .95rem 1rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem}
.topbar .burger{display:none}
.crumb{font-size:.82rem;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:1.3rem 1.3rem 3.5rem;max-width:var(--maxw);width:100%;margin:0 auto;flex:1}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem .9rem;border-radius:11px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);cursor:pointer;font-size:.87rem;font-weight:650;transition:.14s}
.btn:hover{background:var(--bg-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(58,47,176,.28)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-3)}
.btn.sm{padding:.33rem .65rem;font-size:.79rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:36px;height:36px;padding:0}
select,input[type=text],input[type=number],textarea{font-family:inherit;font-size:.87rem;padding:.42rem .6rem;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);width:100%}
input[type=range]{accent-color:var(--brand-2)}
label.fld{display:block;font-size:.76rem;font-weight:700;color:var(--ink-2);margin:.5rem 0 .2rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.tile{display:block;text-decoration:none;color:inherit;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);transition:.15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--brand-2);box-shadow:var(--shadow-lg)}
.tile .kicker{font-size:.69rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.tile h3{margin:.3rem 0;font-size:.99rem}
.tile p{margin:0;font-size:.84rem;color:var(--ink-2)}
.tile .strip{position:absolute;inset:0 auto 0 0;width:5px}
.badge{display:inline-block;padding:.17rem .55rem;border-radius:999px;font-size:.69rem;font-weight:800;letter-spacing:.02em}
.b-x{background:var(--brand-soft);color:var(--brand)}
.b-xi{background:var(--accent-soft);color:var(--accent)}
.b-xii{background:var(--warn-soft);color:var(--warn)}
.b-gray{background:var(--bg-3);color:var(--ink-2)}
.note{border-left:3px solid var(--brand-2);background:var(--brand-soft);padding:.65rem .85rem;border-radius:0 11px 11px 0;font-size:.87rem}
.note.ok{border-color:var(--accent);background:var(--accent-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.muted{color:var(--ink-3);font-size:.83rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg-2)}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:460px}
th,td{padding:.5rem .65rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg-3);font-weight:700;font-size:.77rem}
tbody tr:last-child td{border-bottom:0}

/* =======================================================================
   PANGGUNG SLIDE — gaya desain modern (ala Canva)
   ======================================================================= */
.stage-wrap{position:relative}
.stage{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow-lg);background:#fff;color:#15182f;isolation:isolate;
}
.stage.full{border-radius:0}
.slide-x{--c1:#2a1f7c;--c2:#5b4ae0;--c3:#00e0b0;--c4:#ffd166}
.slide-xi{--c1:#06403a;--c2:#00a186;--c3:#7cf0d2;--c4:#ffb37b}
.slide-xii{--c1:#3d1452;--c2:#8338a8;--c3:#ff8a5b;--c4:#ffd166}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(1rem,3.4vw,3rem);background:#fff;overflow:hidden}
.sl.light{background:linear-gradient(135deg,#ffffff 0%,#f7f8ff 100%)}
.sl.dark{background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 70%,var(--c3) 190%);color:#fff}
.sl .deco{position:absolute;border-radius:50%;filter:blur(.4px);pointer-events:none;opacity:.5}
.sl .deco.b1{width:34%;aspect-ratio:1;background:radial-gradient(circle at 30% 30%,var(--c3),transparent 70%);right:-8%;top:-14%;opacity:.45}
.sl .deco.b2{width:24%;aspect-ratio:1;background:radial-gradient(circle at 60% 60%,var(--c2),transparent 70%);left:-7%;bottom:-12%;opacity:.3}
.sl .deco.ring{border:3px solid var(--c4);background:none;width:14%;aspect-ratio:1;right:7%;bottom:9%;opacity:.35}
.sl .deco.dots{width:26%;height:30%;border-radius:0;background-image:radial-gradient(currentColor 1.6px,transparent 1.6px);background-size:16px 16px;color:var(--c2);opacity:.17;left:3%;top:6%}
.sl .kick{font-size:clamp(.62rem,1.05vw,.82rem);letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--c2);display:flex;align-items:center;gap:.5rem}
.sl.dark .kick{color:var(--c3)}
.sl .kick::before{content:"";width:26px;height:3px;border-radius:3px;background:currentColor;display:inline-block}
.sl h2{font-size:clamp(1.3rem,3.1vw,2.5rem);margin:.5rem 0 .7rem;letter-spacing:-.025em;line-height:1.1}
.sl.dark h2{color:#fff}
.sl ul{margin:.2rem 0;padding:0;list-style:none;font-size:clamp(.82rem,1.45vw,1.14rem)}
.sl ul li{position:relative;padding-left:1.5em;margin:.5em 0;line-height:1.45}
.sl ul li::before{content:"";position:absolute;left:0;top:.52em;width:.62em;height:.62em;border-radius:4px;background:var(--c2);transform:rotate(45deg)}
.sl.dark ul li::before{background:var(--c3)}
.sl .foot{margin-top:auto;display:flex;align-items:center;gap:.6rem;font-size:clamp(.6rem,1vw,.76rem);color:#7b8199;padding-top:.6rem}
.sl.dark .foot{color:rgba(255,255,255,.72)}
.sl .foot .dot{width:6px;height:6px;border-radius:50%;background:var(--c2)}
/* layout: cover */
.sl.cover{justify-content:center}
.sl.cover .meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.sl.cover .chip{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.24rem .75rem;font-size:clamp(.6rem,1.05vw,.78rem);font-weight:650}
.sl.cover h2{font-size:clamp(1.5rem,4.1vw,3.2rem)}
/* layout: split */
.sl.split .body{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(.8rem,2.4vw,2rem);align-items:center;flex:1;min-height:0}
.sl.split .visual{display:grid;place-items:center;height:100%;min-height:0;background:#fff;border-radius:16px;padding:.7rem;box-shadow:0 10px 30px rgba(16,20,40,.1)}
.sl.split .visual img,.sl.split .visual svg{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
/* layout: pemantik */
.sl.pemantik{justify-content:center;align-items:flex-start}
.sl.pemantik h2{font-size:clamp(1.5rem,3.7vw,3rem);max-width:17ch}
.sl.pemantik .qmark{position:absolute;right:4%;bottom:-4%;font-size:clamp(7rem,22vw,17rem);font-weight:900;color:var(--c3);opacity:.22;line-height:1}
/* layout: grid kartu */
.sl.cards .body{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.5rem,1.4vw,1rem);flex:1;min-height:0;margin-top:.3rem}
.sl.cards .kart{background:linear-gradient(145deg,#ffffff,#f3f4ff);border:1px solid #e6e8fa;border-radius:14px;padding:clamp(.5rem,1.3vw,1rem);display:flex;gap:.6rem;align-items:flex-start;box-shadow:0 6px 18px rgba(16,20,40,.06);font-size:clamp(.74rem,1.25vw,1rem);line-height:1.4}
.sl.cards .kart .n{flex:none;width:1.9em;height:1.9em;border-radius:9px;background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:.92em}
/* layout: simulasi */
.sl.simslide{padding:0;background:var(--bg-2);color:var(--ink)}
.sl.simslide .simhead{display:flex;align-items:center;gap:.6rem;padding:.55rem clamp(.7rem,1.8vw,1.3rem);background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;flex:none}
.sl.simslide .simhead b{font-size:clamp(.78rem,1.3vw,1rem)}
.sl.simslide .simhead .tag{margin-left:auto;background:rgba(255,255,255,.18);border-radius:999px;padding:.16rem .6rem;font-size:.68rem;font-weight:700}
.sl.simslide .simarea{flex:1;overflow:auto;padding:clamp(.6rem,1.5vw,1.1rem);background:var(--bg)}
/* animasi masuk */
@keyframes slideIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sl{animation:slideIn .45s cubic-bezier(.2,.8,.25,1) both}
.sl .anim{animation:itemIn .5s cubic-bezier(.2,.8,.25,1) both}
.sl .anim:nth-child(1){animation-delay:.05s}.sl .anim:nth-child(2){animation-delay:.12s}
.sl .anim:nth-child(3){animation-delay:.19s}.sl .anim:nth-child(4){animation-delay:.26s}
.sl .anim:nth-child(5){animation-delay:.33s}.sl .anim:nth-child(6){animation-delay:.4s}
/* kontrol deck */
.deckbar{display:flex;align-items:center;gap:.6rem;margin-top:.75rem;flex-wrap:wrap}
.deckbar .prog{flex:1;min-width:120px;height:6px;background:var(--bg-3);border-radius:99px;overflow:hidden}
.deckbar .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--accent));transition:width .3s}
.rail{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem .1rem;scrollbar-width:thin}
.thumb{flex:none;width:122px;aspect-ratio:16/9;border-radius:9px;border:2px solid var(--line);background:var(--bg-2);cursor:pointer;padding:.3rem .35rem;font-size:.52rem;line-height:1.25;color:var(--ink-2);overflow:hidden;position:relative;text-align:left;transition:.14s}
.thumb:hover{border-color:var(--brand-2)}
.thumb.on{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.thumb b{display:block;font-size:.58rem;color:var(--ink);margin-bottom:.1rem}
.thumb .tn{position:absolute;right:3px;bottom:2px;font-size:.5rem;color:var(--ink-3)}
.thumb.sim{background:linear-gradient(135deg,var(--brand-soft),var(--accent-soft))}
.fsbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:.4rem;z-index:120;background:rgba(10,12,26,.82);padding:.4rem .5rem;border-radius:14px;backdrop-filter:blur(8px)}
.stage-wrap.isfull .fsbar{display:flex}
.fsbar .btn{background:#1d2238;border-color:#333a5c;color:#eef0fa}
.stage-wrap.isfull{position:fixed;inset:0;z-index:110;background:#05060f;display:grid;place-items:center;padding:0}
.stage-wrap.isfull .stage{height:100vh;width:100vw;max-width:none;aspect-ratio:auto;border-radius:0}

/* ---------- simulasi ---------- */
.sim-toolbar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.8rem}
.bars{display:flex;align-items:flex-end;gap:4px;height:clamp(130px,26vh,240px);padding:.5rem;background:linear-gradient(180deg,var(--bg-3),var(--bg-2));border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.bar{flex:1;min-width:7px;background:linear-gradient(180deg,#6f61ff,#3a2fb0);border-radius:6px 6px 3px 3px;position:relative;transition:height .22s cubic-bezier(.3,1.4,.5,1),background .18s,transform .18s;display:flex;justify-content:center;align-items:flex-start;box-shadow:0 3px 10px rgba(58,47,176,.22)}
.bar span{font-size:.6rem;color:#fff;font-weight:800;margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.bar.cmp{background:linear-gradient(180deg,#ffc24d,#e08f00);transform:translateY(-5px) scaleX(1.06)}
.bar.swp{background:linear-gradient(180deg,#ff7a6b,#c7352a);transform:translateY(-9px) scaleX(1.1)}
.bar.done{background:linear-gradient(180deg,#4ff0c6,#00a186)}
.stat-row{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:.4rem .65rem;min-width:96px;box-shadow:var(--shadow)}
.stat i{display:block;font-style:normal;font-size:.63rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.stat b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.log{font-family:var(--mono);font-size:.76rem;background:var(--bg-3);border:1px solid var(--line);border-radius:11px;padding:.55rem .65rem;max-height:160px;overflow:auto;white-space:pre-wrap}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{min-width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--bg-2);border:1px solid var(--line-2);font-weight:700;font-variant-numeric:tabular-nums;transition:.18s;font-size:.85rem}
.cell.hi{background:linear-gradient(135deg,#ffd98a,#f0a93c);border-color:#e08f00;color:#4a3000;transform:translateY(-3px) scale(1.06)}
.cell.ok{background:linear-gradient(135deg,#6ff0cf,#00a186);border-color:#00a186;color:#04302a;animation:pulse .6s ease}
.cell.no{opacity:.32;filter:grayscale(.7)}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.stackbox{display:flex;flex-direction:column-reverse;gap:5px;min-height:190px;padding:.55rem;background:var(--bg-3);border-radius:12px;border:1px dashed var(--line-2)}
.qbox{display:flex;gap:5px;min-height:58px;align-items:center;padding:.55rem;background:var(--bg-3);border-radius:12px;border:1px dashed var(--line-2);overflow-x:auto}
.item{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;border-radius:9px;padding:.4rem .78rem;font-weight:700;animation:pop .26s cubic-bezier(.3,1.5,.5,1);box-shadow:0 4px 12px rgba(58,47,176,.3)}
@keyframes pop{from{transform:scale(.6) translateY(8px);opacity:0}to{transform:none;opacity:1}}
canvas{max-width:100%;background:var(--bg-2);border-radius:12px;border:1px solid var(--line)}
.code{font-family:var(--mono);font-size:.78rem;background:var(--bg-3);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;overflow:auto;line-height:1.55;max-height:290px}
.code .ln{display:block;padding:.05rem .3rem;border-radius:5px;transition:.15s}
.code .ln.cur{background:linear-gradient(90deg,var(--brand-soft),transparent);color:var(--brand);font-weight:800;transform:translateX(3px)}
.chk{display:flex;gap:.5rem;align-items:flex-start;font-size:.86rem;margin:.28rem 0}
.chk input{accent-color:var(--accent);margin-top:.3rem}
.q-card{border:1px solid var(--line);border-radius:13px;background:var(--bg-2);padding:.8rem .9rem;margin-bottom:.7rem}
.q-num{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.opt{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem .6rem;border:1px solid var(--line);border-radius:10px;margin:.3rem 0;cursor:pointer;background:var(--bg-2);font-size:.86rem}
.opt:hover{background:var(--bg-3)}
.opt.correct{background:var(--accent-soft);border-color:var(--accent)}
.opt.wrong{background:var(--danger-soft);border-color:var(--danger)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
.confetti i{position:absolute;width:9px;height:14px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(760deg);opacity:0}}

  {k:"Pengurutan",t:"Selection sort dan insertion sort",img:"selection",b:["<b>Selection sort</b>: cari nilai terkecil pada sisa data, tukar ke posisi depan. Pertukarannya paling sedikit.","<b>Insertion sort</b>: ambil satu data, sisipkan ke posisi yang benar di bagian yang sudah terurut.","Insertion sort sangat cepat bila data sudah hampir terurut.","Bandingkan jumlah perbandingan dan pertukaran untuk menilai efisiensi."],sim:"sorting"},
  {k:"Notasi",t:"Diagram alir dan pseudocode",img:"flowchart",b:["Simbol diagram alir: oval (mulai/selesai), jajar genjang (masukan/keluaran), persegi (proses), belah ketupat (keputusan).","Pseudocode menuliskan algoritma dengan bahasa mirip program, tetapi tetap mudah dibaca manusia.","Tiga struktur dasar: <b>runtunan</b>, <b>percabangan</b>, dan <b>perulangan</b>."]},
  {k:"Contoh",t:"Pseudocode menentukan kelulusan",b:["<code>jumlah ← 0</code>","<code>untuk i dari 1 sampai 5 lakukan</code> → <code>baca nilai</code>; <code>jumlah ← jumlah + nilai</code>","<code>rerata ← jumlah / 5</code>","<code>jika rerata ≥ 75 maka tulis \"Tuntas\" selain itu tulis \"Belum Tuntas\"</code>","Telusuri (tracing) nilai setiap variabel baris demi baris sebelum diketik menjadi program."],sim:"pseudocode"},
  {k:"Refleksi",t:"Algoritma yang baik",b:["Benar: memberi hasil yang tepat untuk semua masukan yang mungkin.","Efisien: tidak boros langkah dan memori.","Jelas: dapat dibaca dan dikerjakan ulang oleh orang lain."]}
 ]}),
M({id:"x3",kelas:"X",fase:"E",sem:"Ganjil",kode:"X.3",jp:8,elemen:"Berpikir Komputasional (terpadu Analisis Data)",
 judul:"Proses Komputasi untuk Memperoleh Data Berkualitas",
 ringkas:"Mengumpulkan, membersihkan, mengolah, dan menafsirkan data untuk mengambil keputusan.",
 tp:["X.BK.7 Memperoleh data yang berkualitas melalui proses komputasi.","X.BK.8 Mengolah dan menyajikan data serta menarik kesimpulan."],
 sims:["dataviz"],
 slides:[
  {k:"Pemantik",t:"Keputusan yang salah karena data yang salah",b:["Sekolah menambah jam layanan perpustakaan berdasarkan data kunjungan satu hari saja. Apa risikonya?","Data yang buruk menghasilkan keputusan yang buruk, meski diolah dengan aplikasi canggih."]},
  {k:"Konsep",t:"Ciri data yang berkualitas",b:["<b>Akurat</b> — sesuai keadaan sebenarnya.","<b>Lengkap</b> — tidak ada bagian penting yang kosong.","<b>Relevan</b> — berhubungan langsung dengan persoalan.","<b>Tepat waktu</b> — masih berlaku saat digunakan.","<b>Beretika</b> — diperoleh dengan izin dan menjaga privasi responden."]},
  {k:"Prosedur",t:"Siklus pengolahan data",b:["Perumusan pertanyaan → penentuan sumber → pengumpulan → pembersihan → pengolahan → visualisasi → interpretasi → publikasi.","Sumber primer: survei dan pengamatan sendiri. Sumber sekunder: data sekolah dan portal data terbuka.","Pembersihan data: hapus data ganda, tandai data kosong, samakan format penulisan."]},
  {k:"Praktik",t:"Mengolah dengan lembar kerja",b:["Fungsi dasar: <code>SUM</code>, <code>AVERAGE</code>, <code>MAX</code>, <code>MIN</code>, <code>COUNT</code>, <code>COUNTIF</code>.","Pilih grafik sesuai jenis data: batang untuk perbandingan, garis untuk perubahan waktu, lingkaran untuk proporsi.","Setiap grafik wajib memiliki judul, label sumbu, dan keterangan sumber."],sim:"dataviz"},
  {k:"Etika",t:"Privasi dalam pengumpulan data",b:["Minta persetujuan sebelum mengumpulkan data pribadi.","Jangan mengumpulkan data yang tidak diperlukan.","Simpan data secara aman dan jangan sebarkan tanpa izin.","Sajikan data apa adanya; memotong sumbu grafik dapat menyesatkan pembaca."]},
  {k:"Refleksi",t:"Dari data ke rekomendasi",b:["Apa temuan utama dari data yang saya kumpulkan?","Apakah simpulan saya benar-benar didukung angka, bukan praduga?","Rekomendasi apa yang masuk akal untuk kelas atau sekolah?"]}
 ]}),
M({id:"x4",kelas:"X",fase:"E",sem:"Ganjil",kode:"X.4",jp:6,elemen:"Berpikir Komputasional",
 judul:"Model Komputer Von Neumann dan Peran Sistem Operasi",
 ringkas:"Cara kerja komputer dari masukan sampai keluaran, dan peran sistem operasi sebagai pengelola.",
 tp:["X.BK.9 Menjelaskan model Von Neumann dan menyimulasikan dinamika Input-Process-Output.","X.BK.10 Menjelaskan peran sistem operasi."],
 sims:["vonneumann","biner"],
 slides:[
  {k:"Pemantik",t:"Apa yang terjadi saat menekan tombol simpan?",b:["Dalam sekejap ada puluhan langkah yang dikerjakan komputer.","Hari ini kita buka 'kotak hitam' itu."]},
  {k:"Arsitektur",t:"Model Von Neumann",img:"vonneumann",b:["Satu memori menyimpan <b>data sekaligus instruksi program</b> — inilah gagasan kunci Von Neumann.","Komponen: unit masukan, memori, unit kendali, unit aritmetika-logika (bersama membentuk CPU), dan unit keluaran.","Alur kerja: <b>Input → Process → Output</b>, dengan <b>Storage</b> untuk menyimpan hasil."]},
  {k:"Siklus",t:"Fetch – Decode – Execute",b:["<b>Fetch</b>: unit kendali mengambil instruksi dari memori.","<b>Decode</b>: instruksi diterjemahkan menjadi perintah yang dimengerti mesin.","<b>Execute</b>: ALU melakukan perhitungan atau operasi logika, hasilnya disimpan ke register atau memori.","Siklus ini berulang miliaran kali per detik."],sim:"vonneumann"},
  {k:"Perangkat",t:"Komponen fisik komputer",img:"pc",b:["Masukan: papan ketik, tetikus, pemindai, mikrofon.","Pemroses: CPU dan memori utama (RAM).","Keluaran: monitor, pencetak, pengeras suara.","Penyimpanan: cakram keras, SSD, dan media lepas."]},
  {k:"Sistem operasi",t:"Pengelola sumber daya",img:"os",b:["Manajemen proses: mengatur giliran program memakai CPU sehingga banyak aplikasi tampak berjalan serentak.","Manajemen memori: membagi RAM antaraplikasi agar tidak saling menimpa.","Manajemen berkas: mengatur penyimpanan, penamaan, dan hak akses berkas.","Manajemen perangkat: menjembatani aplikasi dengan perangkat keras melalui driver.","Antarmuka pengguna: menyediakan tampilan grafis atau baris perintah."]},
  {k:"Representasi",t:"Mengapa komputer memakai biner?",b:["Rangkaian elektronik hanya mengenal dua keadaan: ada arus (1) dan tidak ada arus (0).","Semua data — angka, huruf, gambar, suara — pada akhirnya disimpan sebagai deretan bit.","8 bit = 1 byte; satu huruf pada kode ASCII memerlukan 1 byte."],sim:"biner"}
 ]}),
M({id:"x5",kelas:"X",fase:"E",sem:"Genap",kode:"X.5",jp:10,elemen:"Literasi Digital",
 judul:"Literasi Informasi, Mesin Pencari, dan Periksa Fakta",
 ringkas:"Mencari informasi secara efektif dan memeriksa kebenarannya dengan membaca lateral.",
 tp:["X.LD.1 Menggunakan mesin pencari dengan beragam variabel.","X.LD.2 Memilah fakta, opini, misinformasi, dan disinformasi.","X.LD.3 Menerapkan membaca lateral."],
 sims:["fakta"],
 slides:[
  {k:"Pemantik",t:"Benarkah kabar di grup pesan itu?",b:["Setiap hari kita menerima puluhan informasi tanpa tahu sumbernya.","Satu kali membagikan kabar palsu dapat merugikan banyak orang — dan bisa berakibat hukum."]},
  {k:"Mesin pencari",t:"Kata kunci dan operator pencarian",b:["Gunakan kata kunci spesifik, bukan kalimat panjang.","<code>\"...\"</code> mencari frasa persis; <code>-kata</code> membuang kata tertentu.","<code>site:</code> membatasi pada satu situs, misalnya <code>site:kemdikbud.go.id</code>.","<code>filetype:pdf</code> mencari berkas tertentu; tambahkan tahun untuk membatasi kebaruan."]},
  {k:"Konsep",t:"Fakta, opini, misinformasi, disinformasi",b:["<b>Fakta</b> dapat diverifikasi kebenarannya.","<b>Opini</b> adalah pendapat, sah tetapi tidak bisa dijadikan bukti.","<b>Misinformasi</b> adalah informasi keliru yang disebar tanpa niat jahat.","<b>Disinformasi</b> adalah informasi keliru yang sengaja dibuat untuk menyesatkan."],sim:"fakta"},
  {k:"Teknik",t:"Membaca lateral",b:["Jangan hanya membaca laman yang sedang terbuka — buka tab baru untuk memeriksa siapa penerbitnya.","Telusuri: siapa penulisnya, siapa pemilik situsnya, kapan ditulis, apa sumber datanya.","Bandingkan dengan dua sumber lain yang tepercaya.","Untuk gambar: lakukan pencarian gambar terbalik untuk melihat kapan dan di mana pertama kali muncul."]},
  {k:"Kebiasaan",t:"Sebelum membagikan",b:["Berhenti sejenak jika informasi memancing emosi kuat — itu ciri khas hoaks.","Periksa tanggal; kabar lama sering diedarkan ulang seolah baru.","Jika ragu, jangan bagikan. Diam lebih aman daripada menyebarkan kekeliruan."]}
 ]}),
M({id:"x6",kelas:"X",fase:"E",sem:"Genap",kode:"X.6",jp:10,elemen:"Literasi Digital",
 judul:"Perkakas Digital dan Produksi Konten yang Beretika",
 ringkas:"Fitur lanjut aplikasi perkantoran, produksi konten digital, serta lisensi dan atribusi karya.",
 tp:["X.LD.4 Memanfaatkan fitur lanjut aplikasi perkantoran.","X.LD.5 Memproduksi dan mendiseminasikan konten digital secara etis.","X.LD.9 Menghargai hak atas kekayaan intelektual."],
 sims:["perkantoran"],
 slides:[
  {k:"Pemantik",t:"Dokumen 60 halaman, daftar isi berubah terus",b:["Memformat satu per satu memakan waktu berjam-jam.","Dengan fitur lanjut, pekerjaan yang sama selesai dalam hitungan menit."]},
  {k:"Pengolah dokumen",t:"Fitur yang wajib dikuasai",b:["<b>Gaya (styles)</b> untuk judul dan isi agar format konsisten.","<b>Daftar isi otomatis</b> yang ikut berubah saat halaman bertambah.","<b>Penomoran halaman, header, dan footer</b>.","<b>Referensi dan sitasi</b> untuk karya ilmiah.","<b>Surat massal (mail merge)</b> untuk membuat banyak surat sekaligus."]},
  {k:"Lembar kerja",t:"Rumus, fungsi, dan grafik",b:["Rujukan relatif (<code>A1</code>) dan absolut (<code>$A$1</code>).","Fungsi logika <code>IF</code>, pencarian <code>VLOOKUP</code>/<code>XLOOKUP</code>, dan agregasi <code>SUMIF</code>.","Tabel dan filter untuk menyaring data dengan cepat.","Grafik yang terhubung langsung dengan data sehingga ikut berubah."],sim:"perkantoran"},
  {k:"Integrasi",t:"Menggabungkan antaraplikasi",b:["Tabel dan grafik dari lembar kerja dapat ditempel ke dokumen dan presentasi.","Gunakan tempel tertaut agar perubahan data otomatis memperbarui dokumen.","Prinsip desain presentasi: satu gagasan satu salindia, kontras tinggi, huruf besar, visual seperlunya."]},
  {k:"Etika",t:"Hak kekayaan intelektual dan lisensi",b:["Karya orang lain dilindungi hak cipta meskipun diunggah gratis di internet.","Kenali lisensi terbuka: domain publik, Creative Commons (CC BY, CC BY-SA, CC0).","Selalu cantumkan atribusi: judul karya, pencipta, sumber, dan lisensinya.","Plagiarisme dan pembajakan perangkat lunak melanggar hukum dan merusak nama baik."],sim:"perkantoran"},
  {k:"Produksi",t:"Membuat konten yang bermanfaat",b:["Tentukan tujuan dan sasaran pembaca sebelum membuat konten.","Gunakan bahan berlisensi terbuka atau karya sendiri.","Sebarkan melalui kanal yang sesuai dan tanggapi umpan balik dengan santun.","Contoh projek: konten digital tentang potensi budaya dan wisata Kabupaten Pinrang."]}
 ]}),
M({id:"x7",kelas:"X",fase:"E",sem:"Genap",kode:"X.7",jp:8,elemen:"Literasi Digital",
 judul:"Jaringan Komputer dan Konfigurasi Keamanan Dasar",
 ringkas:"Jaringan lokal dan internet, media kabel dan nirkabel, serta pengamanan dasar.",
 tp:["X.LD.6 Menjelaskan konektivitas jaringan dan menerapkan konfigurasi keamanan dasar."],
 sims:["jaringan"],
 slides:[
  {k:"Pemantik",t:"Mengapa wifi gratis bisa berbahaya?",b:["Data yang melewati jaringan terbuka dapat disadap bila tidak terenkripsi.","Hari ini kita pelajari bagaimana data berjalan dan bagaimana mengamankannya."]},
  {k:"Konsep",t:"Jaringan lokal dan internet",b:["<b>LAN</b> menghubungkan perangkat dalam satu area, misalnya laboratorium sekolah.","<b>Internet</b> adalah jaringan dari jaringan yang mencakup seluruh dunia.","Perangkat penghubung: switch, access point, dan router.","Setiap perangkat memiliki alamat IP agar data sampai ke tujuan yang benar."],img:"topologi"},
  {k:"Media",t:"Kabel dan nirkabel",b:["Kabel (UTP, serat optik): lebih stabil, cepat, dan sulit disadap.","Nirkabel (wifi, bluetooth): praktis, tetapi rentan gangguan dan penyadapan.","Sinyal nirkabel melemah karena jarak, tembok, dan gangguan perangkat lain."],img:"router"},
  {k:"Keamanan",t:"Konfigurasi keamanan dasar",b:["Ganti nama pengguna dan kata sandi bawaan perangkat jaringan.","Gunakan enkripsi WPA2 atau WPA3, jangan WEP atau jaringan terbuka.","Perbarui perangkat lunak (firmware) perangkat jaringan secara berkala.","Pisahkan jaringan tamu dari jaringan utama sekolah.","Pastikan situs yang dibuka menggunakan HTTPS."],sim:"jaringan"},
  {k:"Kebiasaan aman",t:"Saat memakai jaringan publik",b:["Hindari transaksi perbankan di jaringan publik.","Matikan berbagi berkas otomatis.","Keluar dari akun setelah selesai dan lupakan jaringan tersebut."]}
 ]}),
M({id:"x8",kelas:"X",fase:"E",sem:"Genap",kode:"X.8",jp:8,elemen:"Literasi Digital",
 judul:"Keamanan Akun, Privasi Digital, dan Profesi Informatika",
 ringkas:"Kata sandi kuat, autentikasi dua langkah, privasi akun, digitalisasi budaya, dan peluang karier.",
 tp:["X.LD.7 Mengelola kata sandi dan autentikasi dua langkah.","X.LD.8 Mengatur privasi akun dan menyaring konten negatif.","X.LD.10 Menjelaskan digitalisasi budaya Indonesia dan profesi Informatika."],
 sims:["sandi"],
 slides:[
  {k:"Pemantik",t:"Satu kata sandi untuk semua akun",b:["Bila satu layanan bocor, seluruh akunmu ikut terbuka.","Kebocoran data besar terjadi hampir setiap tahun di berbagai layanan dunia."]},
  {k:"Kata sandi",t:"Membuat dan mengelola kata sandi",b:["Panjang lebih penting daripada rumit: gabungan empat kata acak sulit ditebak dan mudah diingat.","Jangan memakai nama, tanggal lahir, atau nama sekolah.","Gunakan <b>manajer kata sandi</b> agar setiap akun punya kata sandi berbeda.","Jangan pernah membagikan kata sandi, termasuk kepada teman dekat."],sim:"sandi"},
  {k:"Lapis kedua",t:"Autentikasi dua langkah (2FA)",b:["Lapisan kedua membuat akun tetap aman meski kata sandi bocor.","Moda: kode dari aplikasi autentikator, kunci keamanan fisik, notifikasi aplikasi, atau SMS (paling lemah).","Simpan kode cadangan di tempat aman dan luring."]},
  {k:"Privasi",t:"Jejak digital dan pengaturan akun",b:["Jejak digital bersifat permanen dan dapat dilihat calon kampus atau pemberi kerja.","Atur siapa yang dapat melihat unggahan, lokasi, dan daftar teman.","Pilah informasi privat (NIK, alamat, nomor telepon) dan publik.","Laporkan dan saring konten negatif; blokir pelaku perundungan dan simpan buktinya."]},
  {k:"Budaya",t:"Digitalisasi budaya Indonesia",b:["Teknologi dapat melestarikan bahasa daerah, naskah kuno, lagu, dan tarian.","Contoh: arsip digital kebudayaan, museum virtual, dan kanal budaya daerah.","Gagasan projek: dokumentasi digital kuliner, tenun, atau wisata Kabupaten Pinrang."]},
  {k:"Karier",t:"Profesi di bidang Informatika",b:["Pengembang perangkat lunak, analis data, administrator jaringan, spesialis keamanan siber.","Perancang antarmuka (UI/UX), pengelola basis data, dan pengembang gim.","Kompetensi kunci: berpikir logis, belajar mandiri, kolaborasi, dan etika kerja.","Jalur: SMA → perguruan tinggi bidang komputer, atau sertifikasi dan portofolio karya."]}
 ]}),
/* ============================ KELAS XI ============================ */
M({id:"xi1",kelas:"XI",fase:"F",sem:"Ganjil",kode:"XI.1",jp:10,elemen:"Berpikir Komputasional",
 judul:"Alur Pengembangan Produk Teknologi Digital dan Analisis Persoalan",
 ringkas:"Dari kebutuhan pengguna sampai pemeliharaan produk, serta merumuskan alternatif solusi.",
 tp:["XI.BK.1 Menjelaskan alur pengembangan produk teknologi digital.","XI.BK.2 Menganalisis persoalan bersolusi jamak dan merumuskan alternatifnya."],
 sims:["pengembangan"],
 slides:[
  {k:"Pemantik",t:"Mengapa aplikasi terus diperbarui?",b:["Produk digital tidak pernah benar-benar selesai; ia tumbuh mengikuti kebutuhan penggunanya.","Perbaikan yang terlambat jauh lebih mahal daripada perencanaan yang matang."]},
  {k:"Daur hidup",t:"Lima tahap pengembangan",b:["<b>Analisis kebutuhan</b> — memahami persoalan dan pengguna sesungguhnya.","<b>Perancangan</b> — alur proses, struktur data, dan rancangan antarmuka.","<b>Implementasi</b> — membangun produk atau menulis kode.","<b>Pengujian</b> — memastikan produk benar dan nyaman dipakai.","<b>Pemeliharaan</b> — memperbaiki, memperbarui, dan mengembangkan."],sim:"pengembangan"},
  {k:"Analisis kebutuhan",t:"Menggali kebutuhan pengguna",b:["Wawancara, pengamatan, dan kuesioner singkat kepada calon pengguna.","Bedakan <b>keinginan</b> dan <b>kebutuhan</b>; tanyakan 'mengapa' hingga akar persoalan.","Tulis kebutuhan sebagai pernyataan terukur: 'petugas dapat mencatat presensi 36 murid kurang dari 2 menit'.","Hindari menebak kebutuhan dari balik meja."]},
  {k:"Perancangan",t:"Dari kebutuhan menjadi rancangan",b:["Diagram alur proses menggambarkan jalannya sistem.","Rancangan antarmuka (wireframe) cukup digambar di kertas pada tahap awal.","Tentukan data apa yang disimpan dan bagaimana strukturnya.","Validasi rancangan kepada pengguna sebelum menulis kode."]},
  {k:"Alternatif",t:"Satu persoalan, banyak solusi",b:["Contoh: mempercepat presensi — kartu QR, pemindai kartu pelajar, atau formulir daring.","Setiap alternatif memiliki biaya, kemudahan, dan risiko berbeda.","Bandingkan dengan kriteria: biaya, waktu pengembangan, kemudahan pemakaian, dan keandalan.","Pilih yang paling sesuai konteks sekolah, bukan yang paling canggih."]},
  {k:"Refleksi",t:"Tahap paling rawan gagal",b:["Mana yang lebih sering gagal: menulis kode atau memahami kebutuhan?","Apa buktinya bahwa rancangan kita benar-benar menjawab kebutuhan pengguna?"]}
 ]}),
M({id:"xi2",kelas:"XI",fase:"F",sem:"Ganjil",kode:"XI.2",jp:10,elemen:"Berpikir Komputasional",
 judul:"Strategi Algoritmik dan Justifikasi Efisiensi",
 ringkas:"Brute force, greedy, divide and conquer, serta cara menilai dan memilih solusi terbaik.",
 tp:["XI.BK.3 Membandingkan strategi algoritmik dengan justifikasi efisiensi.","XI.BK.5 Memilih dan menerapkan solusi terbaik."],
 sims:["sorting","strategi"],
 slides:[
  {k:"Pemantik",t:"Jawaban sama, kecepatan jauh berbeda",b:["Dua program memberi hasil yang sama, tetapi satu selesai 1 detik dan satunya 20 menit.","Perbedaan itu lahir dari strategi algoritmik yang dipilih."]},
  {k:"Strategi",t:"Brute force",b:["Mencoba seluruh kemungkinan lalu memilih yang memenuhi syarat.","Kelebihan: pasti menemukan solusi dan mudah ditulis.","Keterbatasan: jumlah langkah meledak saat data membesar.","Cocok untuk data kecil atau sebagai pembanding kebenaran."]},
  {k:"Strategi",t:"Greedy",b:["Mengambil pilihan terbaik pada setiap langkah tanpa meninjau ulang.","Contoh: penukaran uang dengan pecahan terbesar lebih dahulu.","Cepat, tetapi tidak selalu menghasilkan solusi paling optimal.","Perlu bukti atau pengujian bahwa pilihan serakah memang tepat untuk persoalan itu."],sim:"strategi"},
  {k:"Strategi",t:"Divide and conquer",b:["Membagi persoalan menjadi submasalah sejenis, menyelesaikannya, lalu menggabungkan hasilnya.","Contoh: binary search dan merge sort.","Sering menurunkan jumlah langkah dari n² menjadi n log n.","Memerlukan persoalan yang dapat dipecah secara alami."]},
  {k:"Efisiensi",t:"Menakar jumlah langkah",b:["Perhatikan pertumbuhan langkah terhadap ukuran data n, bukan waktu pada satu komputer.","Urutan dari cepat ke lambat: O(1), O(log n), O(n), O(n log n), O(n²), O(2ⁿ).","Pada n = 1.000.000: n log n ≈ 20 juta langkah, sedangkan n² = 1.000.000.000.000 langkah.","Uji dengan data kecil, sedang, dan besar lalu bandingkan hasilnya."],sim:"sorting"},
  {k:"Keputusan",t:"Kriteria memilih solusi terbaik",b:["Kebenaran lebih dahulu, baru efisiensi.","Pertimbangkan keterbacaan dan kemudahan pemeliharaan.","Perhitungkan keterbatasan perangkat dan waktu pengembangan.","Tuliskan justifikasi: mengapa pilihan ini, apa kelebihan dan keterbatasannya."]}
 ]}),
M({id:"xi3",kelas:"XI",fase:"F",sem:"Ganjil",kode:"XI.3",jp:12,elemen:"Berpikir Komputasional",
 judul:"Struktur Data Kompleks dan Abstrak",
 ringkas:"Senarai bertaut, pohon, graf, dan tabel hash untuk persoalan yang lebih rumit.",
 tp:["XI.BK.4 Merancang struktur data kompleks dan abstrak.","XI.BK.5 Menerapkan solusi terbaik menggunakan struktur data yang dirancang."],
 sims:["graf","stackqueue"],
 slides:[
  {k:"Pemantik",t:"Bagaimana peta menemukan rute tercepat?",b:["Jutaan ruas jalan ditelusuri dalam hitungan detik.","Rahasianya terletak pada struktur data dan algoritma penelusurannya."]},
  {k:"Konsep",t:"Tipe data abstrak",b:["Tipe data abstrak menjelaskan <b>operasi apa</b> yang tersedia, bukan bagaimana disimpan.","Contoh: antrean punya operasi enqueue dan dequeue, tak peduli dibuat dari larik atau senarai bertaut.","Abstraksi memisahkan pengguna struktur dari rincian implementasi."]},
  {k:"Senarai bertaut",t:"Linked list",img:"linkedlist",b:["Setiap simpul menyimpan data dan penunjuk ke simpul berikutnya.","Penambahan dan penghapusan di tengah murah; cukup mengubah penunjuk.","Kelemahan: untuk mencapai elemen ke-n harus ditelusuri dari awal.","Varian: senarai tunggal, ganda, dan melingkar."]},
  {k:"Pohon",t:"Hierarki tanpa siklus",img:"tree",b:["Istilah: akar, simpul anak, daun, dan kedalaman.","Pohon biner pencarian menyimpan data terurut sehingga pencarian cepat.","Contoh penerapan: struktur organisasi sekolah, sistem berkas, dan menu aplikasi."]},
  {k:"Graf",t:"Relasi bebas antarsimpul",img:"graph",b:["Terdiri atas simpul (vertex) dan sisi (edge); bisa berarah atau tidak berarah, berbobot atau tidak.","Representasi: matriks ketetanggaan atau daftar ketetanggaan.","Penelusuran: <b>BFS</b> (melebar) dan <b>DFS</b> (mendalam).","Penerapan: peta jalan, jejaring sosial, dan jaringan komputer."],sim:"graf"},
  {k:"Tabel hash",t:"Pencarian nyaris seketika",img:"hash",b:["Fungsi hash mengubah kunci menjadi indeks lokasi penyimpanan.","Pencarian rata-rata hanya perlu satu langkah, jauh lebih cepat daripada menelusuri daftar.","Tabrakan (collision) ditangani dengan rantai atau penempatan terbuka.","Penerapan: pencarian kontak, kamus, dan penyimpanan sesi pengguna."]},
  {k:"Keputusan",t:"Memilih struktur data",b:["Data tetap dan sering diakses per indeks → larik.","Banyak penyisipan dan penghapusan → senarai bertaut.","Hubungan berjenjang → pohon.","Relasi bebas antarobjek → graf.","Pencarian cepat berdasarkan kunci unik → tabel hash."]}
 ]}),
M({id:"xi4",kelas:"XI",fase:"F",sem:"Ganjil",kode:"XI.4",jp:4,elemen:"Berpikir Komputasional",
 judul:"Model dan Topologi Jaringan Komputer",
 ringkas:"Jenis jaringan, topologi, dan lapisan model TCP/IP.",
 tp:["XI.BK.6 Mengenali model dan topologi jaringan serta lapisan TCP/IP."],
 sims:["jaringan"],
 slides:[
  {k:"Jenis",t:"Cakupan jaringan",b:["<b>PAN</b> — antarperangkat pribadi, misalnya bluetooth.","<b>LAN</b> — satu gedung atau sekolah.","<b>MAN</b> — satu kota.","<b>WAN</b> — antarkota dan antarnegara; internet adalah WAN terbesar."]},
  {k:"Topologi",t:"Pola hubungan perangkat",img:"topologi",b:["<b>Bus</b>: satu kabel utama; murah tetapi satu gangguan melumpuhkan semua.","<b>Bintang</b>: terpusat pada switch; paling umum di sekolah, mudah dirawat.","<b>Cincin</b>: data berputar searah; gangguan satu titik mengganggu jalur.","<b>Mesh</b>: setiap perangkat saling terhubung; sangat andal tetapi mahal."],sim:"jaringan"},
  {k:"Model",t:"Empat lapisan TCP/IP",img:"tcpip",b:["<b>Aplikasi</b> — HTTP, DNS, SMTP; yang dilihat pengguna.","<b>Transport</b> — TCP dan UDP; memastikan data sampai utuh dan berurutan.","<b>Internet</b> — IP; pengalamatan logis dan penentuan rute.","<b>Akses jaringan</b> — ethernet dan wifi; pengiriman bit di media fisik."]},
  {k:"Manfaat",t:"Mengapa berlapis?",b:["Gangguan dapat ditelusuri lapis demi lapis, dari kabel hingga aplikasi.","Perubahan di satu lapisan tidak mengharuskan perubahan di lapisan lain.","Perangkat dari pabrikan berbeda dapat saling bekerja sama."]}
 ]}),
M({id:"xi5",kelas:"XI",fase:"F",sem:"Genap",kode:"XI.5",jp:14,elemen:"Berpikir Komputasional dan Literasi Digital",
 judul:"Pengiriman Data, Troubleshooting, dan Keamanan Jaringan Lanjut",
 ringkas:"Pengalamatan IP, berbagi sumber daya, diagnosis gangguan, dan pengamanan lanjut.",
 tp:["XI.BK.7 Melakukan pengiriman data antarperangkat.","XI.BK.8 Melakukan troubleshooting jaringan.","XI.LD.3 Menerapkan konfigurasi keamanan lanjut."],
 sims:["jaringan"],
 slides:[
  {k:"Pengalamatan",t:"Alamat IP dan subnet",b:["IPv4 ditulis empat angka 0–255, misalnya <code>192.168.1.10</code>.","Subnet mask menentukan bagian jaringan dan bagian host.","Alamat privat (192.168.x.x, 10.x.x.x) dipakai di jaringan lokal.","DHCP memberi alamat otomatis; alamat statis dipakai untuk server dan pencetak."]},
  {k:"Pengiriman data",t:"Berbagi sumber daya",b:["Berbagi berkas dan pencetak dalam satu LAN.","Protokol transfer: HTTP/HTTPS, FTP/SFTP, dan SMB untuk berbagi berkas.","Data dipecah menjadi paket, diberi alamat, dikirim, lalu disusun ulang di tujuan."],sim:"jaringan"},
  {k:"Troubleshooting",t:"Diagnosis berlapis dari bawah ke atas",b:["1. Fisik: kabel, lampu indikator, daya perangkat.","2. Koneksi: apakah mendapat alamat IP? <code>ipconfig</code> / <code>ifconfig</code>.","3. Jalur: uji dengan <code>ping</code> ke gateway, lalu ke internet.","4. Nama: uji DNS dengan <code>nslookup</code>; coba buka alamat IP langsung.","5. Aplikasi: periksa pengaturan peramban, firewall, dan proxy.","Catat setiap langkah dan hasilnya agar penanganan dapat diulang."],sim:"jaringan"},
  {k:"Keamanan",t:"Pengamanan lanjut",b:["<b>Firewall</b> menyaring lalu lintas berdasarkan aturan.","<b>Enkripsi</b> membuat data tak terbaca pihak lain; HTTPS dan WPA3 adalah contohnya.","<b>VPN</b> membuat terowongan aman melewati jaringan publik.","Segmentasi jaringan memisahkan jaringan guru, murid, dan tamu.","Pembaruan berkala menutup celah keamanan yang sudah diketahui."]},
  {k:"Etika",t:"Tanggung jawab pengelola jaringan",b:["Akses administratif adalah amanah, bukan alat untuk mengintip orang lain.","Menyadap atau masuk ke sistem tanpa izin melanggar hukum.","Laporkan celah keamanan yang ditemukan kepada pihak berwenang di sekolah."]}
 ]}),
M({id:"xi6",kelas:"XI",fase:"F",sem:"Genap",kode:"XI.6",jp:22,elemen:"Literasi Digital dan Analisis Data",
 judul:"Riset Digital, Verifikasi Konten, dan Analisis Data untuk Pengambilan Keputusan",
 ringkas:"Riset lanjut, verifikasi teks–gambar–video, data terbuka, pengolahan, dan visualisasi.",
 tp:["XI.LD.1 Riset dengan mesin pencari.","XI.LD.2 Verifikasi konten dan membaca lateral.","XI.AD.1 Memanfaatkan sumber data terbuka dan legal.","XI.AD.2 Mengolah data untuk keputusan dan prediksi.","XI.AD.3 Menyajikan dan mengomunikasikan hasil analisis."],
 sims:["dataviz","fakta"],
 slides:[
  {k:"Riset",t:"Strategi riset digital",b:["Rumuskan pertanyaan riset yang spesifik dan dapat dijawab data.","Gunakan operator pencarian, mesin pencari akademik, dan portal resmi.","Kelola daftar sumber sejak awal: judul, penulis, penerbit, tahun, dan tautan."]},
  {k:"Verifikasi",t:"Memeriksa teks, gambar, dan video",b:["Teks: telusuri klaim ke sumber aslinya, bukan ke unggahan ulang.","Gambar: pencarian gambar terbalik, periksa bayangan, cuaca, papan nama, dan metadata.","Video: periksa potongan dan konteks; cari versi utuh dan tanggal unggah pertama.","Waspadai konten sintetis (AI) — cek kejanggalan tangan, teks, dan suara."],sim:"fakta"},
  {k:"Data terbuka",t:"Sumber yang legal dan tepercaya",b:["Portal data pemerintah pusat dan daerah, lembaga statistik, serta data sekolah.","Periksa lisensi dan ketentuan penggunaan sebelum mengolah dan memublikasikan.","Catat metadata: siapa yang mengumpulkan, kapan, bagaimana, dan cakupannya."]},
  {k:"Pengolahan",t:"Membersihkan dan merapikan data",b:["Hapus duplikat, perbaiki format tanggal dan angka, samakan penulisan kategori.","Tandai data kosong; jangan diam-diam diisi dengan tebakan.","Satu baris satu amatan, satu kolom satu variabel."]},
  {k:"Analisis",t:"Statistik deskriptif dan prediksi sederhana",b:["Pusat data: rerata, median, modus. Sebaran: jangkauan dan simpangan.","Rerata mudah tertarik nilai ekstrem; median lebih tahan pencilan.","Pola kecenderungan dapat dipakai memprediksi, tetapi selalu sertakan ketidakpastian.","Korelasi bukan sebab-akibat."],sim:"dataviz"},
  {k:"Komunikasi",t:"Visualisasi yang jujur",b:["Pilih grafik sesuai jenis data dan beri judul yang menyatakan temuan.","Mulai sumbu nilai dari nol untuk diagram batang.","Sertakan sumber data dan jumlah responden.","Tutup laporan dengan rekomendasi yang dapat ditindaklanjuti sekolah."]}
 ]}),
/* ============================ KELAS XII ============================ */
M({id:"xii1",kelas:"XII",fase:"F",sem:"Ganjil",kode:"XII.1",jp:16,elemen:"Algoritma dan Pemrograman",
 judul:"Strategi Algoritmik dan Pengembangan Program Terstruktur",
 ringkas:"Dari pemilihan strategi, notasi algoritma, sampai program modular yang rapi.",
 tp:["XII.AP.1 Memahami dan memilih strategi algoritmik yang tepat.","XII.AP.2 Mengembangkan program terstruktur dari notasi algoritma."],
 sims:["pseudocode","strategi"],
 slides:[
  {k:"Pemantik",t:"Program panjang yang sulit diperbaiki",b:["Program 500 baris dalam satu fungsi hampir mustahil ditelusuri.","Program yang baik adalah penerjemahan setia dari algoritma yang dipilih secara sadar."]},
  {k:"Strategi",t:"Memilih strategi sebelum mengetik",b:["Pahami persoalan: masukan, keluaran, dan batasan ukuran data.","Pilih strategi: brute force untuk data kecil, greedy bila pilihan lokal terbukti optimal, divide and conquer bila persoalan dapat dipecah.","Tuliskan algoritma lebih dahulu dalam notasi, baru diterjemahkan ke kode."],sim:"strategi"},
  {k:"Struktur",t:"Tiga struktur dasar program",b:["<b>Runtunan</b>: perintah dijalankan berurutan.","<b>Percabangan</b>: <code>if</code>, <code>else if</code>, <code>else</code>, dan <code>switch</code>.","<b>Perulangan</b>: <code>for</code> untuk jumlah pasti, <code>while</code> untuk kondisi.","Hindari lompatan tak beraturan yang membuat alur sulit diikuti."]},
  {k:"Modularisasi",t:"Fungsi dan prosedur",b:["Satu fungsi mengerjakan satu tugas yang jelas.","Parameter adalah masukan fungsi; nilai kembalian adalah hasilnya.","Variabel lokal mencegah efek samping yang sulit dilacak.","Fungsi memudahkan pengujian: setiap bagian dapat diuji terpisah."]},
  {k:"Rekursi",t:"Fungsi yang memanggil dirinya",b:["Perlu <b>kasus dasar</b> agar pemanggilan berhenti.","Contoh: faktorial, Fibonacci, dan penelusuran struktur pohon.","Rekursi membuat kode ringkas, tetapi boros memori tumpukan bila terlalu dalam."],sim:"pseudocode"},
  {k:"Praktik baik",t:"Menulis program yang hidup lama",b:["Nama variabel dan fungsi menjelaskan maksudnya.","Konsisten dalam indentasi dan gaya penulisan.","Tangani masukan yang tidak wajar, jangan berasumsi pengguna selalu benar.","Uji setiap bagian segera setelah ditulis."]}
 ]}),
M({id:"xii2",kelas:"XII",fase:"F",sem:"Ganjil",kode:"XII.2",jp:10,elemen:"Algoritma dan Pemrograman",
 judul:"Implementasi Algoritma Standar dan Kualitas Kode",
 ringkas:"Menuliskan algoritma pencarian dan pengurutan ke kode sumber yang berkualitas.",
 tp:["XII.AP.3 Mengembangkan algoritma standar ke kode sumber dengan memperhatikan kualitas."],
 sims:["sorting","searching","kodereview"],
 slides:[
  {k:"Pemantik",t:"Kode yang jalan belum tentu kode yang baik",b:["Kode dibaca manusia jauh lebih sering daripada ditulis.","Kode buruk tetap berjalan hari ini, tetapi mahal diperbaiki bulan depan."]},
  {k:"Implementasi",t:"Dari algoritma ke kode",img:"code",b:["Terjemahkan langkah algoritma satu per satu, jangan langsung mengoptimalkan.","Pastikan batas indeks benar; kesalahan satu langkah (off-by-one) paling sering terjadi.","Uji dengan data kosong, satu elemen, data terurut, dan data terbalik."],sim:"sorting"},
  {k:"Kualitas",t:"Ciri kode yang berkualitas",b:["<b>Keterbacaan</b>: nama bermakna, fungsi ringkas, indentasi konsisten.","<b>Modularitas</b>: tidak ada pengulangan kode yang sama di banyak tempat.","<b>Dokumentasi</b>: komentar menjelaskan 'mengapa', bukan mengulang 'apa'.","<b>Efisiensi</b>: pilih algoritma tepat sebelum mengutak-atik detail kecil."],sim:"kodereview"},
  {k:"Pengukuran",t:"Mengukur kinerja program",b:["Catat waktu mulai dan selesai untuk data berukuran berbeda.","Bandingkan pertumbuhan waktu, bukan satu angka tunggal.","Pengukuran dipengaruhi perangkat; jalankan beberapa kali lalu ambil rerata."],sim:"searching"},
  {k:"Tinjauan",t:"Code review sejawat",b:["Tinjau kode teman dengan fokus pada keterbacaan dan kebenaran, bukan selera pribadi.","Berikan komentar spesifik dan sopan, sertakan usulan perbaikan.","Tinjauan sejawat menemukan kesalahan yang tidak terlihat oleh penulisnya."]}
 ]}),
M({id:"xii3",kelas:"XII",fase:"F",sem:"Ganjil",kode:"XII.3",jp:10,elemen:"Algoritma dan Pemrograman",
 judul:"Pemeliharaan dan Penyempurnaan Program",
 ringkas:"Jenis kesalahan, debugging, pengujian, refactoring, dokumentasi, dan pengelolaan versi.",
 tp:["XII.AP.4 Memelihara dan menyempurnakan program melalui pengujian, penelusuran kesalahan, perapian kode, dan dokumentasi."],
 sims:["kodereview","pseudocode"],
 slides:[
  {k:"Pemantik",t:"Kemarin jalan, hari ini gagal",b:["Program yang hidup selalu berubah: data bertambah, kebutuhan bergeser, perangkat diperbarui.","Kemampuan memperbaiki sama pentingnya dengan kemampuan membuat."]},
  {k:"Kesalahan",t:"Tiga jenis kesalahan",b:["<b>Sintaksis</b> — aturan penulisan dilanggar; ditolak sebelum program jalan.","<b>Runtime</b> — muncul saat dijalankan, misalnya pembagian dengan nol.","<b>Logika</b> — program berjalan tetapi hasilnya salah; paling sulit ditemukan."]},
  {k:"Debugging",t:"Menelusuri kesalahan secara sistematis",b:["1. Tirukan kesalahan dengan langkah yang pasti.","2. Persempit wilayah kode yang dicurigai.","3. Periksa nilai variabel di titik-titik kunci.","4. Perbaiki satu hal saja, lalu uji ulang.","5. Catat penyebab dan solusinya agar tidak terulang."],sim:"pseudocode"},
  {k:"Pengujian",t:"Merancang kasus uji",b:["Kasus normal, kasus batas (0, 1, nilai maksimum), dan kasus tidak wajar (huruf pada isian angka).","Tuliskan hasil yang diharapkan sebelum menjalankan program.","Uji regresi: jalankan semua kasus uji setiap kali kode diubah."]},
  {k:"Refactoring",t:"Merapikan tanpa mengubah perilaku",b:["Ganti nama yang membingungkan, pecah fungsi panjang, hilangkan kode kembar.","Lakukan dalam langkah kecil dan uji setiap selesai satu langkah.","Refactoring bukan menambah fitur; perilaku program harus tetap sama."],sim:"kodereview"},
  {k:"Dokumentasi",t:"Dokumentasi dan pengelolaan versi",b:["README menjelaskan tujuan, cara memasang, dan cara menjalankan program.","Komentar untuk bagian yang keputusannya tidak jelas.","Pengelolaan versi (misalnya Git) menyimpan riwayat perubahan dan memudahkan kerja tim.","Pesan perubahan yang baik menjelaskan apa dan mengapa, bukan sekadar 'perbaikan'."]}
 ]}),
M({id:"xii4",kelas:"XII",fase:"F",sem:"Genap",kode:"XII.4",jp:10,elemen:"Algoritma dan Pemrograman",
 judul:"Struktur Data Kompleks dan Pemanfaatan Library",
 ringkas:"Menerapkan struktur data kompleks pada program nyata dan memakai pustaka secara tepat.",
 tp:["XII.AP.5 Mengimplementasikan program dengan struktur data kompleks.","XII.AP.6 Memanfaatkan library secara tepat."],
 sims:["graf","stackqueue"],
 slides:[
  {k:"Penerapan",t:"Struktur data di dalam program",b:["Pilih struktur sesuai operasi yang paling sering dilakukan program.","Sering mencari berdasarkan kunci → tabel hash atau kamus bawaan bahasa.","Data berjenjang → pohon; relasi antarobjek → graf.","Ukur dampaknya: catat waktu sebelum dan sesudah penggantian struktur data."],sim:"graf"},
  {k:"Library",t:"Mengapa tidak membuat semuanya sendiri",b:["Pustaka yang matang sudah diuji banyak orang dan jarang mengandung kesalahan mendasar.","Menghemat waktu sehingga fokus pada persoalan yang benar-benar khas.","Tetapi: pahami cara kerjanya, jangan jadi pengguna buta."]},
  {k:"Kriteria",t:"Memilih pustaka dengan bijak",b:["Periksa lisensinya; pastikan boleh dipakai untuk keperluan sekolah atau komersial.","Lihat kapan terakhir diperbarui dan seberapa aktif pengembangnya.","Baca dokumentasi resmi dan contoh penggunaannya.","Perhatikan keamanan; pustaka usang bisa membawa celah."]},
  {k:"Etika",t:"Atribusi dan tanggung jawab",b:["Cantumkan pustaka yang dipakai beserta lisensinya di berkas dokumentasi.","Kode salinan dari internet wajib dipahami, diuji, dan dicantumkan sumbernya.","Kamu tetap bertanggung jawab atas program yang kamu rilis."]}
 ]}),
M({id:"xii5",kelas:"XII",fase:"F",sem:"Genap",kode:"XII.5",jp:6,elemen:"Literasi Digital",
 judul:"Perancangan Kebutuhan Sistem Komputer",
 ringkas:"Menentukan spesifikasi perangkat keras dan lunak sesuai kebutuhan pengguna dan anggaran.",
 tp:["XII.LD.1 Merancang kebutuhan sistem komputer sesuai kebutuhan pengguna.","XII.LD.2 Mengkreasi konten digital dengan peralatan dan metode bervariasi."],
 sims:["spek"],
 slides:[
  {k:"Pemantik",t:"Termahal belum tentu tepat",b:["Komputer untuk tata usaha dan untuk studio desain punya kebutuhan sangat berbeda.","Tugas kita: menyesuaikan spesifikasi dengan pekerjaan nyata dan anggaran."]},
  {k:"Analisis",t:"Memahami beban kerja",b:["Pekerjaan ringan: dokumen, lembar kerja, peramban.","Menengah: pengolahan data besar, pemrograman, penyuntingan gambar.","Berat: penyuntingan video, pemodelan 3D, pelatihan model kecerdasan artifisial.","Tanyakan aplikasi yang dipakai, ukuran berkas, dan berapa lama perangkat dipakai per hari."]},
  {k:"Spesifikasi",t:"Komponen yang menentukan kinerja",b:["<b>Prosesor</b>: jumlah inti dan kecepatan; menentukan kemampuan menghitung.","<b>RAM</b>: menentukan berapa banyak pekerjaan dapat berjalan bersamaan.","<b>Penyimpanan</b>: SSD jauh lebih responsif daripada HDD.","<b>Kartu grafis</b>: penting untuk grafis, video, dan komputasi paralel.","<b>Perangkat lunak</b>: sistem operasi dan aplikasi, termasuk legalitas lisensinya."],sim:"spek"},
  {k:"Anggaran",t:"Menyusun usulan",b:["Buat dua alternatif: kebutuhan minimum dan kebutuhan ideal.","Hitung total biaya termasuk perangkat pendukung, lisensi, dan garansi.","Pertimbangkan daya tahan 3–5 tahun ke depan, bukan hanya hari ini.","Sajikan dalam dokumen rancangan yang ringkas dan mudah dipahami pimpinan."]}
 ]}),
M({id:"xii6",kelas:"XII",fase:"F",sem:"Genap",kode:"XII.6",jp:20,elemen:"Literasi Digital serta Algoritma dan Pemrograman",
 judul:"Hukum Digital, Demokrasi Digital, Transaksi Digital, dan Projek Akhir",
 ringkas:"Hak dan kewajiban warga digital, partisipasi publik, transaksi aman, dan karya akhir.",
 tp:["XII.LD.3 Memahami hukum dan perundang-undangan isu digital.","XII.LD.4 Memahami pemanfaatan teknologi digital dalam demokrasi.","XII.LD.5 Menerapkan keamanan akun lanjut.","XII.LD.6 Memahami loka pasar, perbankan, dan dompet digital beserta keamanannya.","XII.AP.5 Merancang dan mengimplementasikan karya digital solusi persoalan nyata."],
 sims:["sandi","projek"],
 slides:[
  {k:"Hukum",t:"Aturan dunia digital di Indonesia",b:["Undang-undang tentang informasi dan transaksi elektronik mengatur konten, penghinaan, penipuan, dan akses ilegal.","Undang-undang pelindungan data pribadi mengatur pengumpulan dan penggunaan data orang lain.","Undang-undang hak cipta melindungi karya tulis, musik, gambar, dan perangkat lunak.","Yang kita unggah dan sebarkan dapat dimintai pertanggungjawaban secara hukum."]},
  {k:"Etika",t:"Batas perilaku digital yang aman",b:["Jangan menyebar data pribadi orang lain tanpa izin (doxing).","Jangan mengunggah tuduhan tanpa bukti; gunakan jalur pengaduan resmi.","Jangan masuk ke akun atau sistem milik orang lain, meski 'hanya iseng'.","Hormati karya orang lain: minta izin dan cantumkan sumber."]},
  {k:"Demokrasi",t:"Teknologi dan partisipasi publik",b:["Kanal aspirasi daring, keterbukaan data anggaran, dan layanan publik digital.","Manfaat: partisipasi lebih luas, pengawasan lebih mudah, informasi lebih cepat.","Risiko: hoaks politik, gelembung informasi, manipulasi opini oleh akun otomatis.","Sikap kita: verifikasi sebelum percaya, berdebat dengan argumen, bukan hinaan."]},
  {k:"Transaksi",t:"Berbelanja dan bertransaksi dengan aman",b:["Pastikan situs resmi dan menggunakan HTTPS; waspadai alamat yang mirip.","Jangan pernah membagikan OTP kepada siapa pun, termasuk yang mengaku petugas.","Gunakan rekening bersama pada loka pasar dan simpan bukti transaksi.","Periksa mutasi secara berkala dan aktifkan notifikasi transaksi.","Ciri penipuan: mendesak, hadiah mendadak, harga jauh di bawah pasar, dan tautan asing."],sim:"sandi"},
  {k:"Projek",t:"Projek akhir: karya digital untuk masyarakat",b:["Pilih persoalan nyata di sekolah atau Kabupaten Pinrang.","Tahap: analisis kebutuhan → rancangan → pembuatan → pengujian bersama pengguna → gelar karya.","Produk dapat berupa aplikasi, situs, sistem pendataan, atau konten edukasi digital.","Penilaian: perencanaan 20%, pelaksanaan 30%, produk 30%, komunikasi hasil 20%."],sim:"projek"},

const API='https://commons.wikimedia.org/w/api.php';

async function queryByTitle(title,w){
  const r=await fetch(`${API}?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=${w}&titles=${encodeURIComponent('File:'+title)}`,{mode:'cors'});
  if(!r.ok)throw new Error('api');const j=await r.json();const p=Object.values(j.query&&j.query.pages||{})[0];
  return (!p||p.missing!==undefined||!p.imageinfo)?null:p.imageinfo[0];
}
async function queryBySearch(q,w){
  const r=await fetch(`${API}?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=${w}`,{mode:'cors'});
  if(!r.ok)throw new Error('api');const j=await r.json();const p=Object.values(j.query&&j.query.pages||{})[0];
  return (!p||!p.imageinfo)?null:p.imageinfo[0];
}
function creditOf(i){try{const m=i.extmetadata||{};
  const a=(m.Artist&&m.Artist.value||'').replace(/<[^>]+>/g,'').trim();
  const l=(m.LicenseShortName&&m.LicenseShortName.value||'').trim();
  return [a,l].filter(Boolean).join(' · ')}catch(e){return ''}}
async function fetchAndStore(slot){
  const meta=IMAGES[slot];if(!meta)return null;const w=meta.w||800;let info=null;

  const resp=await fetch(info.thumburl||info.url,{mode:'cors'});if(!resp.ok)return null;
  const blob=await resp.blob();if(!blob||blob.size<200)return null;

  await IDB.set(slot,rec);return rec;
}

function buildDeck(m){
  const kls='slide-'+m.kelas.toLowerCase();
  const ex=(typeof EXTRA!=='undefined'&&EXTRA[m.id])||{cek:[],kuis:[],aktivitas:null};
  const daftar=modulesOf(m.kelas), pos=daftar.findIndex(x=>x.id===m.id);
  const prev=pos>0?daftar[pos-1]:null, next=pos>=0&&pos<daftar.length-1?daftar[pos+1]:null;
  const out=[{type:'cover',kls},{type:'tujuan',kls},{type:'apersepsi',kls,prev}];
  const cek=(ex.cek||[]).slice(); let sejak=0;
  m.slides.forEach((s,i)=>{
    const pemantik=(s.k||'').toLowerCase().startsWith('pemantik');
    const layout=pemantik?'pemantik':s.img?'split':(s.b.length>=4&&i%2===1)?'cards':'bullets';
    out.push({type:'konten',layout,s,kls,idx:i});
    if(s.sim){out.push({type:'sim',sim:s.sim,kls,judul:s.t});sejak=0;return}
    sejak++;
    if(!pemantik&&sejak>=2&&cek.length){out.push({type:'cek',q:cek.shift(),kls});sejak=0}
  });
  while(cek.length) out.push({type:'cek',q:cek.shift(),kls});
  if(ex.aktivitas) out.push({type:'aktivitas',a:ex.aktivitas,kls});
  if(ex.kuis&&ex.kuis.length) out.push({type:'kuis',kuis:ex.kuis,kls});
  out.push({type:'refleksi',kls});
  out.push({type:'lanjut',kls,next});
  return out;
}

/* widget kuis interaktif di dalam salindia */
function mountKuis(box,soal){
  let i=0,benar=0,terjawab=false;
  function tampil(){
    terjawab=false;
    if(i>=soal.length){
      const pct=Math.round(benar/soal.length*100);
      box.innerHTML=`<div class="kuis-hasil">
        <div class="ring" style="--p:${pct}%"><div class="in"><b>${benar}/${soal.length}</b><span>benar</span></div></div>
        <p>${pct===100?'Luar biasa! Seluruh jawaban tepat.':pct>=67?'Bagus! Tinggal satu bagian lagi yang perlu diperkuat.':'Mari kita ulas kembali bersama bagian yang masih sulit.'}</p>
        <button class="btn sm" id="kz-ulang">Ulangi kuis</button></div>`;
      if(pct===100) confetti(60);
      $('#kz-ulang',box).onclick=()=>{i=0;benar=0;tampil()};
      return;
    }
    const s=soal[i];
    box.innerHTML=`<div class="kuis-top"><span>Soal ${i+1} dari ${soal.length}</span>
      <span class="kuis-prog"><i style="width:${(i)/soal.length*100}%"></i></span></div>
      <p class="kuis-q">${esc(s.q)}</p>
      <div class="kuis-opt">${s.o.map((o,j)=>`<button class="kz" data-j="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>
      <div class="kuis-fb" style="display:none"></div>`;
    $$('.kz',box).forEach(b=>b.onclick=()=>{
      if(terjawab)return;terjawab=true;
      const j=+b.dataset.j,ok=j===s.k;
      $$('.kz',box).forEach(x=>{if(+x.dataset.j===s.k)x.classList.add('ok');});
      if(!ok)b.classList.add('no');else benar++;
      const fb=$('.kuis-fb',box);fb.style.display='block';
      fb.className='kuis-fb '+(ok?'ok':'no');
      fb.innerHTML=(ok?'<b>Tepat!</b> ':'<b>Belum tepat.</b> Jawaban yang benar: <b>'+esc(s.o[s.k])+'</b>. ')+
        `<button class="btn sm primary" id="kz-next" style="margin-left:.4rem">${i===soal.length-1?'Lihat hasil':'Soal berikutnya →'}</button>`;
      $('#kz-next',box).onclick=()=>{i++;tampil()};
    });
  }
  tampil();
}

/* ---------- 1. Pengurutan ---------- */
SIMS.sorting={
 judul:"Visualisasi Algoritma Pengurutan",
 desc:"Amati bubble, selection, dan insertion sort bekerja langkah demi langkah. Hitung perbandingan dan pertukaran untuk menilai efisiensinya.",
 html:`<div class="sim-toolbar">
   <select id="so-alg" style="width:auto"><option value="bubble">Bubble sort</option><option value="selection">Selection sort</option><option value="insertion">Insertion sort</option></select>
   <input id="so-data" type="text" style="width:260px" placeholder="8, 2, 7, 4, 1, 9, 3">
   <button class="btn sm" id="so-apply">Pakai data</button>
   <button class="btn sm" id="so-rand">Acak</button>
   <button class="btn sm primary" id="so-play">▶ Jalankan</button>
   <button class="btn sm" id="so-step">Satu langkah</button>
   <button class="btn sm" id="so-reset">Ulangi</button>
   <label style="font-size:.78rem;color:var(--ink-3)">Kecepatan</label><input id="so-speed" type="range" min="1" max="10" value="6" style="width:110px">
 </div>
 <div class="bars" id="so-bars"></div>
 <div class="stat-row">
   <div class="stat"><i>Perbandingan</i><b id="so-cmp">0</b></div>
   <div class="stat"><i>Pertukaran</i><b id="so-swp">0</b></div>
   <div class="stat"><i>Langkah</i><b id="so-stp">0 / 0</b></div>
   <div class="stat"><i>Status</i><b id="so-sts">Siap</b></div>
 </div>
 <p class="muted" style="margin-top:.8rem">Kuning = sedang dibandingkan · Merah = ditukar · Hijau = sudah pada posisi akhir.</p>
 <div class="note" style="margin-top:.6rem" id="so-ket"></div>`,
 mount(){
  let arr=[8,2,7,4,1,9,3], steps=[], idx=0, timer=null;
  const bars=$('#so-bars');
  function gen(alg,a0){
    const a=[...a0], st=[]; let cmp=0,swp=0;
    const snap=(type,i,j,done=[])=>st.push({a:[...a],type,i,j,cmp,swp,done:[...done]});
    snap('start',-1,-1);
    if(alg==='bubble'){
      for(let n=a.length;n>1;n--){let tukar=false;
        for(let i=0;i<n-1;i++){cmp++;snap('cmp',i,i+1,range(n,a.length));
          if(a[i]>a[i+1]){[a[i],a[i+1]]=[a[i+1],a[i]];swp++;tukar=true;snap('swap',i,i+1,range(n,a.length));}}
        if(!tukar) break;}
    }else if(alg==='selection'){
      for(let i=0;i<a.length-1;i++){let min=i;
        for(let j=i+1;j<a.length;j++){cmp++;snap('cmp',min,j,range(i,0,true));if(a[j]<a[min])min=j;}
        if(min!==i){[a[i],a[min]]=[a[min],a[i]];swp++;snap('swap',i,min,range(i,0,true));}}
    }else{
      for(let i=1;i<a.length;i++){let j=i;
        while(j>0){cmp++;snap('cmp',j-1,j,range(i,0,true));
          if(a[j-1]>a[j]){[a[j-1],a[j]]=[a[j],a[j-1]];swp++;snap('swap',j-1,j,range(i,0,true));j--;}else break;}}
    }
    snap('done',-1,-1,a.map((_,i)=>i));
    return st;
    function range(n,len,fromStart){const r=[];if(fromStart){for(let i=0;i<n;i++)r.push(i)}else{for(let i=n-1;i<len;i++)r.push(i)}return r}
  }
  function draw(s){
    const max=Math.max(...s.a,1);
    bars.innerHTML=s.a.map((v,i)=>{
      let cls='bar';
      if(s.done.includes(i)||s.type==='done')cls+=' done';
      if(s.type==='cmp'&&(i===s.i||i===s.j))cls+=' cmp';
      if(s.type==='swap'&&(i===s.i||i===s.j))cls+=' swp';
      return `<div class="${cls}" style="height:${Math.round(v/max*100)}%" title="${v}"><span>${v}</span></div>`;
    }).join('');
    $('#so-cmp').textContent=s.cmp; $('#so-swp').textContent=s.swp;
    $('#so-stp').textContent=`${idx} / ${steps.length-1}`;
    $('#so-sts').textContent=s.type==='done'?'Selesai ✓':(idx===0?'Siap':'Berjalan');
    if(s.type==='done'&&!draw._done){draw._done=1;confetti(50)}
    if(s.type!=='done')draw._done=0;
  }
  function reset(){
    clearInterval(timer);timer=null;
    steps=gen($('#so-alg').value,arr);idx=0;draw(steps[0]);
    const n=arr.length, alg=$('#so-alg').value;
    const tot=steps[steps.length-1];
    $('#so-ket').innerHTML=`<b>Perkiraan:</b> untuk ${n} data, algoritma ini memerlukan <b>${tot.cmp}</b> perbandingan dan <b>${tot.swp}</b> pertukaran. ${alg==='selection'?'Selection sort unggul bila pertukaran mahal.':alg==='insertion'?'Insertion sort sangat cepat bila data hampir terurut.':'Bubble sort paling mudah dipahami, tetapi paling banyak pertukaran.'}`;
  }
  function step(){ if(idx<steps.length-1){idx++;draw(steps[idx]);} else {clearInterval(timer);timer=null;$('#so-play').textContent='▶ Jalankan';} }
  $('#so-apply').onclick=()=>{
    const v=$('#so-data').value.split(/[,\s]+/).map(Number).filter(n=>!isNaN(n)).slice(0,16);
    if(v.length<2) return toast('Masukkan minimal 2 angka');
    arr=v;reset();};
  $('#so-rand').onclick=()=>{arr=Array.from({length:rnd(7,12)},()=>rnd(5,99));$('#so-data').value=arr.join(', ');reset()};
  $('#so-alg').onchange=reset; $('#so-reset').onclick=reset; $('#so-step').onclick=step;
  $('#so-play').onclick=()=>{
    if(timer){clearInterval(timer);timer=null;$('#so-play').textContent='▶ Jalankan';return}
    if(idx>=steps.length-1) reset();
    $('#so-play').textContent='⏸ Jeda';
    timer=setInterval(step, 620-($('#so-speed').value*58));
  };
  $('#so-speed').oninput=()=>{if(timer){clearInterval(timer);timer=setInterval(step,620-($('#so-speed').value*58))}};
  $('#so-data').value=arr.join(', ');
  reset();
 }
};

SIMS.searching={
 judul:"Pencarian Berurutan vs Pencarian Biner",
 desc:"Bandingkan jumlah langkah kedua algoritma pada data terurut. Perhatikan betapa cepat pencarian biner mempersempit wilayah pencarian.",
 html:`<div class="sim-toolbar">
   <label style="font-size:.78rem">Jumlah data</label><input id="se-n" type="number" min="8" max="64" value="24" style="width:84px">
   <label style="font-size:.78rem">Cari nilai</label><input id="se-t" type="number" value="37" style="width:84px">
   <button class="btn sm" id="se-new">Data baru</button>
   <button class="btn sm primary" id="se-run1">Jalankan pencarian berurutan</button>
   <button class="btn sm primary" id="se-run2">Jalankan pencarian biner</button>
 </div>
 <div class="cells" id="se-cells"></div>
 <div class="stat-row">
   <div class="stat"><i>Algoritma</i><b id="se-alg">—</b></div>
   <div class="stat"><i>Langkah</i><b id="se-step">0</b></div>
   <div class="stat"><i>Hasil</i><b id="se-res">—</b></div>
   <div class="stat"><i>Perkiraan teori</i><b id="se-the">—</b></div>
 </div>
 <div class="log" id="se-log" style="margin-top:.8rem">Pilih salah satu algoritma untuk memulai.</div>`,
 mount(){
  let data=[],busy=false;
  const cells=$('#se-cells');
  function newData(){
    const n=Math.max(8,Math.min(64,+$('#se-n').value||24));
    const set=new Set(); while(set.size<n) set.add(rnd(1,99));
    data=[...set].sort((a,b)=>a-b); paint();
    $('#se-t').value=data[rnd(0,data.length-1)];
    $('#se-the').textContent=`berurutan ≤${n} · biner ≤${Math.ceil(Math.log2(n))}`;
  }
  function paint(hi=[],ok=-1,no=[]){
    cells.innerHTML=data.map((v,i)=>{
      let c='cell'; if(hi.includes(i))c+=' hi'; if(no.includes(i))c+=' no'; if(i===ok)c+=' ok';
      return `<div class="${c}">${v}</div>`;}).join('');
  }
  function log(s){const l=$('#se-log');l.textContent+=(l.textContent?'\n':'')+s;l.scrollTop=l.scrollHeight}
  async function seq(){
    if(busy)return;busy=true;const t=+$('#se-t').value;
    $('#se-alg').textContent='Berurutan';$('#se-log').textContent='';let n=0;
    for(let i=0;i<data.length;i++){
      n++;paint([i]);$('#se-step').textContent=n;
      log(`Langkah ${n}: periksa indeks ${i} → ${data[i]} ${data[i]===t?'= target, ditemukan!':'bukan target'}`);
      await sleep(170);
      if(data[i]===t){paint([],i);$('#se-res').textContent=`Ketemu (indeks ${i})`;confetti(36);busy=false;return}
    }
    $('#se-res').textContent='Tidak ada';busy=false;
  }
  async function bin(){
    if(busy)return;busy=true;const t=+$('#se-t').value;
    $('#se-alg').textContent='Biner';$('#se-log').textContent='';
    let lo=0,hi=data.length-1,n=0;
    while(lo<=hi){
      const mid=Math.floor((lo+hi)/2);n++;
      const buang=[];for(let i=0;i<data.length;i++) if(i<lo||i>hi) buang.push(i);
      paint([mid],-1,buang);$('#se-step').textContent=n;
      log(`Langkah ${n}: wilayah [${lo}..${hi}], tengah indeks ${mid} → ${data[mid]}`);
      await sleep(420);
      if(data[mid]===t){paint([],mid,buang);$('#se-res').textContent=`Ketemu (indeks ${mid})`;log('Target ditemukan.');confetti(36);busy=false;return}
      if(data[mid]<t){log(`  ${data[mid]} < ${t}, buang separuh kiri`);lo=mid+1}
      else{log(`  ${data[mid]} > ${t}, buang separuh kanan`);hi=mid-1}
    }
    $('#se-res').textContent='Tidak ada';log('Target tidak ditemukan.');busy=false;
  }
  $('#se-new').onclick=newData; $('#se-run1').onclick=seq; $('#se-run2').onclick=bin;
  newData();
 }
};

 </div>
 <h3>Catatan operasi</h3><div class="log" id="sq-log">Belum ada operasi.</div>
 <div class="note" style="margin-top:.8rem">Coba masukkan data 1, 2, 3 ke keduanya lalu keluarkan semuanya. Perhatikan urutan keluarnya berbeda.</div>`,
 mount(){
  let S=[],Q=[],n=1;
  const log=s=>{const l=$('#sq-log');if(l.textContent==='Belum ada operasi.')l.textContent='';l.textContent+=(l.textContent?'\n':'')+s;l.scrollTop=l.scrollHeight};
  const draw=()=>{
    $('#sq-stack').innerHTML=S.map(v=>`<div class="item">${esc(v)}</div>`).join('');
    $('#sq-queue').innerHTML=Q.map(v=>`<div class="item">${esc(v)}</div>`).join('');
    $('#sq-stop').textContent=S.length?`Puncak (top): ${S[S.length-1]} · ${S.length} data`:'Kosong';
    $('#sq-qfront').textContent=Q.length?`Depan (front): ${Q[0]} · ${Q.length} data`:'Kosong';
  };
  const val=id=>{const el=$(id);const v=el.value.trim()||('D'+(n++));el.value='';return v};
  $('#sq-push').onclick=()=>{if(S.length>=8)return toast('Tumpukan penuh');const v=val('#sq-si');S.push(v);log(`push("${v}") → masuk ke puncak`);draw()};
  $('#sq-pop').onclick=()=>{if(!S.length)return toast('Tumpukan kosong (stack underflow)');const v=S.pop();log(`pop() → keluar "${v}" dari puncak`);draw()};
  $('#sq-enq').onclick=()=>{if(Q.length>=8)return toast('Antrean penuh');const v=val('#sq-qi');Q.push(v);log(`enqueue("${v}") → masuk di belakang`);draw()};
  $('#sq-deq').onclick=()=>{if(!Q.length)return toast('Antrean kosong');const v=Q.shift();log(`dequeue() → keluar "${v}" dari depan`);draw()};
  draw();
 }
};

/* ---------- 4. Von Neumann ---------- */
SIMS.vonneumann={
 judul:"Siklus Komputer Von Neumann",
 desc:"Jalankan program kecil langkah demi langkah dan amati siklus fetch – decode – execute pada memori, register, dan ALU.",
 html:`<div class="sim-toolbar">
   <button class="btn sm primary" id="vn-step">Langkah berikutnya</button>
   <button class="btn sm" id="vn-run">▶ Jalankan otomatis</button>
   <button class="btn sm" id="vn-reset">Ulangi</button>
 </div>
 <div class="grid c2">
  <div><h3 style="margin-top:0">Memori</h3><div id="vn-mem"></div></div>
  <div><h3 style="margin-top:0">CPU</h3>
    <div class="stat-row" style="margin-top:0">
      <div class="stat"><i>PC (pencacah)</i><b id="vn-pc">0</b></div>
      <div class="stat"><i>IR (instruksi)</i><b id="vn-ir">—</b></div>
      <div class="stat"><i>ACC (akumulator)</i><b id="vn-acc">0</b></div>
    </div>
    <h3>Tahap</h3><div id="vn-fase" class="row"></div>
    <h3>Keluaran</h3><div class="log" id="vn-out" style="max-height:120px">—</div>
  </div>
 </div>
 <div class="note" style="margin-top:.9rem" id="vn-ket">Program menghitung <b>(12 + 30) − 7</b> lalu menampilkan hasilnya.</div>`,
 mount(){
  const PROG=[
   {k:'LOAD 10',d:'Ambil isi alamat 10 ke akumulator'},
   {k:'ADD 11',d:'Tambahkan isi alamat 11 ke akumulator'},
   {k:'SUB 12',d:'Kurangi akumulator dengan isi alamat 12'},
   {k:'STORE 13',d:'Simpan akumulator ke alamat 13'},
   {k:'OUT 13',d:'Tampilkan isi alamat 13'},
   {k:'HALT',d:'Berhenti'}];
  const DATA={10:12,11:30,12:7,13:0};
  let pc=0,acc=0,ir='—',fase=0,mem={...DATA},out=[],timer=null;
  function drawMem(){
    let h='<div class="tbl-wrap"><table><thead><tr><th>Alamat</th><th>Isi</th><th>Keterangan</th></tr></thead><tbody>';
    PROG.forEach((p,i)=>{h+=`<tr style="${i===pc?'background:var(--brand-soft)':''}"><td>${i}</td><td><code>${p.k}</code></td><td>${i===pc?'<b>← akan dijalankan</b>':p.d}</td></tr>`});
    Object.keys(mem).forEach(a=>{h+=`<tr><td>${a}</td><td><b>${mem[a]}</b></td><td>data</td></tr>`});
    return h+'</tbody></table></div>';
  }
  function paint(){
    $('#vn-mem').innerHTML=drawMem();
    $('#vn-pc').textContent=pc;$('#vn-ir').textContent=ir;$('#vn-acc').textContent=acc;
    $('#vn-out').textContent=out.length?out.join('\n'):'—';
    $('#vn-fase').innerHTML=['Fetch','Decode','Execute'].map((f,i)=>
      `<span class="badge ${i===fase?'b-x':'b-gray'}" style="padding:.3rem .7rem">${f}</span>`).join(' ');
  }
  function step(){
    const inst=PROG[pc]; if(!inst){clearInterval(timer);timer=null;return}
    if(fase===0){ir=inst.k;fase=1;}
    else if(fase===1){fase=2;}
    else{
      const [op,arg]=inst.k.split(' ');const a=+arg;
      if(op==='LOAD')acc=mem[a];
      else if(op==='ADD')acc+=mem[a];
      else if(op==='SUB')acc-=mem[a];
      else if(op==='STORE')mem[a]=acc;
      else if(op==='OUT')out.push(`Keluaran: ${mem[a]}`);
      else if(op==='HALT'){out.push('Program berhenti.');clearInterval(timer);timer=null;paint();return}
      pc++;fase=0;
    }
    paint();
  }
  $('#vn-step').onclick=step;
  $('#vn-run').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#vn-run').textContent='▶ Jalankan otomatis';return}
    $('#vn-run').textContent='⏸ Jeda';timer=setInterval(step,620)};
  $('#vn-reset').onclick=()=>{clearInterval(timer);timer=null;$('#vn-run').textContent='▶ Jalankan otomatis';pc=0;acc=0;ir='—';fase=0;mem={...DATA};out=[];paint()};
  paint();
 }
};

SIMS.biner={
 judul:"Konversi Biner, Desimal, dan Sandi Huruf",
 desc:"Komputer hanya mengenal 0 dan 1. Coba ubah bilangan dan huruf menjadi deretan bit.",
 html:`<div class="grid c2">
  <div><h3 style="margin-top:0">Desimal ↔ Biner</h3>
   <label class="fld">Bilangan desimal (0–255)</label><input id="bn-dec" type="number" min="0" max="255" value="42">
   <div class="cells" id="bn-bits" style="margin-top:.8rem"></div>

   <div class="stat-row"><div class="stat"><i>Biner</i><b id="bn-bin">—</b></div><div class="stat"><i>Heksadesimal</i><b id="bn-hex">—</b></div></div>
  </div>
  <div><h3 style="margin-top:0">Teks → kode biner</h3>
   <label class="fld">Ketik teks singkat</label><input id="bn-txt" type="text" value="Pinrang" maxlength="24">

   <p class="muted">Setiap huruf disimpan sebagai 8 bit (1 byte) menggunakan kode ASCII.</p>
  </div></div>`,
 mount(){
  const bits=$('#bn-bits');

    let v=Math.max(0,Math.min(255,+$('#bn-dec').value||0));
